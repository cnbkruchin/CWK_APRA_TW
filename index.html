<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CWK Championship Planner</title>
<meta name="description" content="ระบบวางแผนการแข่งขัน CWK JAEGER ROBOT • APRA International Final 2026 • SPIKE Remote Soccer – Junior">
<meta name="theme-color" content="#1f2a44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CWK APRA">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Cdefs%3E%3CclipPath id=%22b%22%3E%3Ccircle cx=%22256%22 cy=%22256%22 r=%22170%22/%3E%3C/clipPath%3E%3C/defs%3E%3Crect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22%23b51f32%22/%3E%3Ccircle cx=%22256%22 cy=%22256%22 r=%22170%22 fill=%22%23fff%22/%3E%3Cg clip-path=%22url%28%23b%29%22 fill=%22%231f2a44%22%3E%3Cpath d=%22M256 196L313 237.5 291.3 304.5H220.7L198.9 237.5Z%22/%3E%3Cpath d=%22M256 128 208.4 93.5 226.6 37.5 285.4 37.5 303.6 93.5ZM377.7 216.4 395.9 160.5 454.7 160.5 472.8 216.4 425.3 251ZM331.2 359.6 390 359.6 408.2 415.5 360.6 450 313.1 415.5ZM180.8 359.6 198.9 415.5 151.4 450 103.8 415.5 122 359.6ZM134.3 216.4 86.7 251 39.2 216.4 57.3 160.5 116.1 160.5Z%22/%3E%3C/g%3E%3Cpath d=%22M256 196V128M313 237.5L377.7 216.4M291.3 304.5L331.2 359.6M220.7 304.5L180.8 359.6M198.9 237.5L134.3 216.4%22 stroke=%22%231f2a44%22 stroke-width=%2214%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%22256%22 cy=%22256%22 r=%22170%22 fill=%22none%22 stroke=%22%231f2a44%22 stroke-width=%2210%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#f5f7fa; --text:#1b2333; --muted:#5b6578; --border:#dce1ea;
  --brand:#1f2a44; --brand-2:#33456f; --on-brand:#ffffff;
  --accent:#b51f32; --accent-ink:#ffffff; --accent-soft:#fbe8ea;
  --ok:#1b7a45; --ok-soft:#e3f3e9; --warn:#935d00; --warn-soft:#fff2d9;
  --info:#2c5bb0; --info-soft:#e7eefb; --gold:#a87400; --gold-soft:#fff4d6; --purple:#6f45b0;
  --mine:#fff6e7; --sel:#1f2a44; --sel-ink:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:14px; --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d121d; --surface:#151c2b; --surface-2:#1c2436; --text:#e6eaf2; --muted:#9aa4b7; --border:#2a3447;
    --brand:#0a1020; --brand-2:#1d2a48; --on-brand:#ffffff;
    --accent:#ff5d70; --accent-ink:#1a0005; --accent-soft:#3b1820;
    --ok:#4fc483; --ok-soft:#14301f; --warn:#f0b64a; --warn-soft:#33270e;
    --info:#7ea6ff; --info-soft:#18243f; --gold:#f2c14e; --gold-soft:#33290f; --purple:#b393f0;
    --mine:#2a2516; --sel:#e6eaf2; --sel-ink:#0d121d;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d121d; --surface:#151c2b; --surface-2:#1c2436; --text:#e6eaf2; --muted:#9aa4b7; --border:#2a3447;
  --brand:#0a1020; --brand-2:#1d2a48; --on-brand:#ffffff;
  --accent:#ff5d70; --accent-ink:#1a0005; --accent-soft:#3b1820;
  --ok:#4fc483; --ok-soft:#14301f; --warn:#f0b64a; --warn-soft:#33270e;
  --info:#7ea6ff; --info-soft:#18243f; --gold:#f2c14e; --gold-soft:#33290f; --purple:#b393f0;
  --mine:#2a2516; --sel:#e6eaf2; --sel-ink:#0d121d;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 "Noto Sans Thai","Sukhumvit Set","Leelawadee UI","Thonburi","Sarabun",Tahoma,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);-webkit-tap-highlight-color:transparent}
a{color:var(--info)}
button{font:inherit;color:inherit}
.tnum,.t-big,.bscore,.clocks b,.st td{font-variant-numeric:tabular-nums}
h1{font-size:22px;line-height:1.3;margin:0 0 4px}
h2{font-size:18px;line-height:1.35;margin:0 0 8px}
h3{font-size:16px;line-height:1.4;margin:0 0 8px}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px} .danger-text{color:var(--accent);font-weight:700}
.kicker{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.spacer{flex:1}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
ul.plain{margin:0;padding-left:18px} ul.plain li{margin-bottom:6px;font-size:14px}
.sec{margin:18px 2px 10px;font-size:15px;color:var(--muted)}

/* app bar */
.appbar{position:sticky;top:0;z-index:30;background:var(--brand);color:var(--on-brand);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;color:inherit;text-decoration:none}
.brand svg{width:34px;height:34px;flex:none;border-radius:9px}
.brand-text{min-width:0}
.brand b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clocks{display:flex;gap:10px;flex:none}
.clocks div{text-align:center;line-height:1.1}
.clocks small{display:block;font-size:10.5px;opacity:.72}
.clocks b{font-size:16px}
.icon-btn{background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:rgba(127,127,127,.15)}
.icon-btn svg{width:22px;height:22px}

main{max-width:940px;margin:0 auto;padding:16px}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);text-decoration:none;padding:4px 2px;border-radius:10px;min-width:0;white-space:nowrap}
.tabbar a svg{width:24px;height:24px}
.tabbar a.on{color:var(--accent);font-weight:700}
@media (min-width:760px){
  .tabbar{left:50%;right:auto;transform:translateX(-50%);bottom:12px;width:560px;border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:6px}
  body{padding-bottom:110px}
}
svg.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* generic */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px;border-radius:9px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.btn.danger{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger-outline{color:var(--accent);border-color:var(--accent);background:transparent}
.link{background:none;border:0;color:var(--info);font-weight:700;font-size:13.5px;cursor:pointer;padding:6px 0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:middle;white-space:nowrap;border:1px solid var(--border)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.bad{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:var(--brand-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--brand-2)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;min-height:38px}
.chip-btn.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.chip.live{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pbar{height:7px;background:rgba(127,127,127,.2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s}

input:not([type=checkbox]):not([type=radio]),select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;min-height:42px;width:100%;max-width:100%}
textarea{resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb, var(--info) 55%, transparent);outline-offset:1px}
.form{display:grid;gap:12px}
.form label,label.field{display:grid;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:6px}

/* hero */
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;border:20px solid #b51f32;opacity:.45;pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .kicker{color:rgba(255,255,255,.78)}
.hero h1{font-size:24px;margin-bottom:2px}
.hero .sub{opacity:.85;font-size:14.5px}
.hero .cd{margin-top:14px}
.hero .cd span{font-size:13.5px;opacity:.85}
.hero .cd b{display:block;font-size:30px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero .tags span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.hero .pbar{background:rgba(255,255,255,.22)} .hero .pbar i{background:#ff6b7d}
.hero .next{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2);font-size:14.5px}
.hero .plan{margin-top:8px;font-size:14.5px;opacity:.92}
.hero .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}

/* next match */
.nextm .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:10px 0 12px}
.nextm .side{font-weight:800;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.nextm .side small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.nextm .side.me{color:var(--accent)}
.nextm .mid{font-size:13px;color:var(--muted);line-height:1.25}
.nextm .mid b{display:block;font-size:22px;color:var(--text)}
.nextm .info{display:grid;gap:6px;font-size:14.5px;margin-bottom:10px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.alert.bad{background:var(--accent-soft);color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;color:var(--text);text-decoration:none;box-shadow:var(--shadow);min-width:0}
.tile .tk{font-size:12.5px;color:var(--muted);font-weight:700}
.tile b{font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile b small{font-size:15px;color:var(--muted);font-weight:600}
.tile .ts{font-size:12px;color:var(--muted)}
.tile.warn{border-color:var(--warn)} .tile.warn b{color:var(--warn)}
.tile.bad{border-color:var(--accent);background:var(--accent-soft)} .tile.bad b{color:var(--accent)}

/* matches */
.match{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.match.mine{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.match header{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px;flex-wrap:wrap}
.match header .t{font-size:15px}
.res{margin-left:auto;font-weight:700;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.res.ok{background:var(--ok-soft);color:var(--ok)} .res.bad{background:var(--accent-soft);color:var(--accent)} .res.warn{background:var(--warn-soft);color:var(--warn)}
.tline{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--border)}
.match header + .tline{border-top:0}
.tname{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere;line-height:1.3}
.tname small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.tname select{font-weight:700}
.tname.sel{display:flex;align-items:center;gap:4px}
.tname.sel select{flex:1;min-width:0}
.seg.grid{display:grid;grid-template-columns:1fr 1fr;overflow:visible}
@media (min-width:560px){.seg.grid{grid-template-columns:repeat(4,1fr)}}
.tline.win .tname{font-weight:800}
.tline.win .tname::before{content:"✓ ";color:var(--ok)}
.tline.me .tname{color:var(--accent)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:42px;height:42px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:21px;font-weight:800;cursor:pointer;line-height:1;padding:0}
.stepper button:active{transform:scale(.95)}
.stepper input{width:50px !important;height:42px;text-align:center;border:1px solid var(--border);border-radius:11px;background:var(--mine) !important;font-size:21px !important;font-weight:800;padding:0 !important}
.stepper.sm button{width:32px;height:32px;font-size:17px;border-radius:9px}
.stepper.sm b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.yline{display:flex;align-items:center;gap:8px;padding-top:8px;margin-top:4px;border-top:1px dashed var(--border);font-size:13.5px;flex-wrap:wrap}
.ycard{display:inline-block;width:13px;height:18px;border-radius:2px;background:#f4c430;box-shadow:0 0 0 1px rgba(0,0,0,.15);vertical-align:middle;flex:none}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ko-note{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.et{background:var(--warn-soft);border-radius:10px;padding:9px 11px;margin-top:8px;font-size:13.5px;display:grid;gap:7px}
.et-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.st{width:100%;border-collapse:collapse;font-size:14px}
.st th,.st td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.st th{font-size:12px;color:var(--muted);font-weight:700}
.st .team{text-align:left;white-space:normal;min-width:130px;line-height:1.3}
.st .team small{color:var(--muted);font-size:11.5px}
.st tbody tr.q td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.st tbody tr.me{background:var(--mine)}
.st tbody tr.me .team{color:var(--accent);font-weight:700}
.st .pts{font-weight:800;font-size:15px}
@media (max-width:519px){.st .xs-hide{display:none}.st .team{min-width:96px}.st th,.st td{padding:8px 4px}}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px}
.tie-notes{margin:10px 0 0;padding:10px 12px;background:var(--info-soft);border-radius:10px;font-size:13.5px}
.tie-notes li{margin:2px 0}
.outcomes{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.outcomes li{display:flex;gap:10px;align-items:baseline;padding:8px 11px;border-radius:10px;background:var(--surface-2);font-size:14.5px}
.outcomes li b{min-width:44px}
.outcomes li.ok{background:var(--ok-soft)} .outcomes li.ok b{color:var(--ok)}
.outcomes li.warn{background:var(--warn-soft)} .outcomes li.warn b{color:var(--warn)}
.outcomes li.bad{background:var(--accent-soft)} .outcomes li.bad b{color:var(--accent)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.qgrid .q{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.qgrid .q.me{background:var(--mine);color:var(--accent)}
.bracket{display:grid;gap:0 14px}
@media (min-width:760px){.bracket{grid-template-columns:1fr 1fr}}
.champ{background:linear-gradient(135deg,#6b4a00,#a87400);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px}
.champ .kicker{color:rgba(255,255,255,.8)}
.champ h2{font-size:22px;margin:0}

/* timeline */
.timeline{list-style:none;margin:0;padding:0}
.tl{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--c,var(--border));border-radius:13px;padding:12px 10px 12px 11px;margin-bottom:8px;box-shadow:var(--shadow)}
.tl.type-match{--c:var(--accent)} .tl.type-ko{--c:var(--gold)} .tl.type-rest{--c:var(--ok)} .tl.type-admin{--c:var(--info)} .tl.type-practice{--c:var(--purple)}
.tl.type-match,.tl.type-ko{background:linear-gradient(90deg,var(--mine),var(--surface) 70%)}
.tl.past{opacity:.62}
.tl.now{box-shadow:0 0 0 2px var(--accent);opacity:1}
.tl-time{line-height:1.2}
.tl-time b{font-size:16.5px;display:block}
.tl-time span{display:block;font-size:12.5px;color:var(--muted)}
.tl-time small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.tl-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.tl h3{margin:0 0 2px;font-size:15.5px}
.tl-place{font-size:13px;color:var(--muted)}
.tl-plan{font-size:14px;margin:6px 0 2px}

/* ------------------------------------------------------------------
 * Standings + tie-break (F3–F4): แต้ม → พบกันเอง → ผลต่างประตู → ประตูได้
 * ------------------------------------------------------------------ */
function tableRows(g) {
  const rows = {};
  S.teams.filter((t) => t.group === g).forEach((t) => { rows[t.code] = { code: t.code, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }; });
  const results = [];
  gMatches(g).forEach((m) => {
    if (!hasScore(m) || !rows[m.a] || !rows[m.b]) return;
    const A = rows[m.a], B = rows[m.b];
    A.p++; B.p++; A.gf += m.ga; A.ga += m.gb; B.gf += m.gb; B.ga += m.ga;
    const res = m.ga > m.gb ? 'a' : m.ga < m.gb ? 'b' : 'd';
    if (res === 'a') { A.w++; B.l++; A.pts += 3; } else if (res === 'b') { B.w++; A.l++; B.pts += 3; } else { A.d++; B.d++; A.pts++; B.pts++; }
    results.push({ a: m.a, b: m.b, res });

  return { rows, results };
}
function h2hPoints(codes, results) {

  codes.forEach((c) => { pts[c] = 0; });
  results.forEach((r) => {
    if (!set.has(r.a) || !set.has(r.b)) return;
    if (r.res === 'a') pts[r.a] += 3; else if (r.res === 'b') pts[r.b] += 3; else { pts[r.a]++; pts[r.b]++; }
  });

}
function rankRows(list, results, canUseGoals) {
  const sorted = list.map((r) => ({ ...r })).sort((x, y) => y.pts - x.pts);
  const blocks = []; const notes = [];
  let i = 0;
  while (i < sorted.length) {
    let j = i;
    while (j < sorted.length && sorted[j].pts === sorted[i].pts) j++;
    const cl = sorted.slice(i, j);
    if (cl.length === 1) { cl[0].h2h = 0; blocks.push(cl); }
    else {
      const hp = h2hPoints(cl.map((r) => r.code), results);
      cl.forEach((r) => { r.h2h = hp[r.code]; });
      const goals = canUseGoals(cl);
      cl.sort((x, y) => (y.h2h - x.h2h) || (goals ? ((y.gd - x.gd) || (y.gf - x.gf)) : 0));
      let a = 0;
      while (a < cl.length) {
        let b = a + 1;
        while (b < cl.length && cl[b].h2h === cl[a].h2h && (!goals || (cl[b].gd === cl[a].gd && cl[b].gf === cl[a].gf))) b++;
        blocks.push(cl.slice(a, b)); a = b;
      }
      for (let k = 0; k < cl.length - 1; k++) {
        const x = cl[k], y = cl[k + 1];
        notes.push({ hi: x.code, lo: y.code, x, y, by: x.h2h !== y.h2h ? 'h2h' : !goals ? 'pending' : x.gd !== y.gd ? 'gd' : x.gf !== y.gf ? 'gf' : 'tie' });
      }
    }
    i = j;
  }
  let pos = 1; const ranked = [];
  blocks.forEach((bl) => { bl.forEach((r) => ranked.push({ ...r, pos, posMax: pos + bl.length - 1 })); pos += bl.length; });
  return { ranked, notes };
}
function standings(g) {
  const key = 'st:' + g;
  if (memo.has(key)) return memo.get(key);
  const { rows, results } = tableRows(g);
  const { ranked, notes } = rankRows(Object.values(rows), results, () => true);
  const ms = gMatches(g);
  const out = { ranked, notes, played: ms.filter(hasScore).length, total: ms.length };
  out.complete = out.played === out.total;

}
/* ทุกความเป็นไปได้ของนัดที่เหลือ (ชนะ/เสมอ/แพ้) → อันดับดีสุด/แย่สุดของแต่ละทีม */
function scenario(g) {
  const key = 'sc:' + g + ':' + S.event.myTeam;
  if (memo.has(key)) return memo.get(key);
  const { rows, results } = tableRows(g);
  const codes = Object.keys(rows);
  const remaining = gMatches(g).filter((m) => !hasScore(m) && rows[m.a] && rows[m.b]);
  const fixed = {};
  codes.forEach((c) => { fixed[c] = !remaining.some((m) => m.a === c || m.b === c); });
  const my = S.event.myTeam;
  const myNext = remaining.filter((m) => m.a === my || m.b === my).sort(byStart)[0] || null;
  const agg = {}; codes.forEach((c) => { agg[c] = { best: 99, worst: 0 }; });
  const byNext = { W: { best: 99, worst: 0, n: 0 }, D: { best: 99, worst: 0, n: 0 }, L: { best: 99, worst: 0, n: 0 } };
  const N = Math.min(remaining.length, 9);
  const total = Math.pow(3, N);
  const OUT = ['a', 'b', 'd'];
  for (let idx = 0; idx < total; idx++) {
    let x = idx; const pts = {};
    codes.forEach((c) => { pts[c] = rows[c].pts; });
    const res = results.slice(); let nx = null;
    for (let k = 0; k < N; k++) {
      const o = OUT[x % 3]; x = Math.floor(x / 3);
      const m = remaining[k];

      res.push({ a: m.a, b: m.b, res: o });

    }

    const { ranked } = rankRows(list, res, (cl) => cl.every((r) => r.fixed));

      const a = agg[r.code]; a.best = Math.min(a.best, r.pos); a.worst = Math.max(a.worst, r.posMax);

function qStatus(a, remaining) {

function outcomeText(b) {

  if (b.worst <= 1) return { cls: 'ok', t: 'แชมป์กลุ่มแน่นอน' };
  if (b.worst <= Q) return { cls: 'ok', t: b.best === 1 ? `เข้ารอบแน่นอน (อันดับ 1–${b.worst})` : 'เข้ารอบแน่นอน' };

}
function tieText(n) {

function resInfo(ref) {

  if (!num(m.ga) && !num(m.gb)) return { t: 'ยังไม่แข่ง', cls: '' };
  if (!hasScore(m)) return { t: 'กรอกไม่ครบ', cls: 'warn' };
  const mySide = isMe(s.a) ? 'a' : isMe(s.b) ? 'b' : null;
  const w = kind === 'g' ? (m.ga > m.gb ? 'a' : m.gb > m.ga ? 'b' : 'd') : (koSide(id) || 'd');

/* ------------------------------------------------------------------
 * Day status
 * ------------------------------------------------------------------ */
function dayStatus() {
  const items = sortedSchedule(); const now = Date.now();
  if (!items.length) return { mode: 'empty' };
  const first = items[0], last = items.reduce((a, b) => (toMin(b.end) > toMin(a.end) ? b : a), items[0]);
  const startMs = evMs(first.start), endMs = evMs(last.end);
  if (now < startMs) return { mode: 'before', first, startMs };
  if (now >= endMs) return { mode: 'after' };
  const cur = items.find((i) => evMs(i.start) <= now && now < evMs(i.end)) || null;
  const next = items.find((i) => evMs(i.start) > now) || null;
  return { mode: 'during', cur, next };
}

  const gear = S.checklists.gear, gd = gear.filter((x) => x.done).length;
  const sd = S.schedule.filter((x) => x.done).length;
  return `${hero}
  ${nextMatchCard()}
  <section class="card">

    <a class="tile" href="#plan" data-action="go" data-tab="plan" data-key="planTab" data-val="rules"><span class="tk">ตรวจตามกติกา</span><b>${rp}<small>/${S.rules.length}</small></b><span class="ts">ข้อที่ผ่านแล้ว</span></a>
    <a class="tile" href="#plan" data-action="go" data-tab="plan" data-key="planTab" data-val="check"><span class="tk">อุปกรณ์ & สเปกหุ่น</span><b>${gd}<small>/${gear.length}</small></b><span class="ts">รายการที่พร้อม</span></a>
    <a class="tile" href="#schedule" data-action="go" data-tab="schedule"><span class="tk">ตารางวันแข่ง</span><b>${sd}<small>/${S.schedule.length}</small></b><span class="ts">รายการที่เสร็จ</span></a>
  </div>`;
}

function nextMatchCard() {
  const fx = myFixtures(); const next = fx.find((f) => !f.done); const e = S.event; const my = e.myTeam;
  if (!next) {
    const pl = myPlacement();
    if (pl) return `<section class="card"><div class="kicker">ผลงานของเรา</div><h2>${esc(pl)}</h2><p class="muted">${esc(e.name)} • ${esc(e.category)}</p></section>`;
    const g = myGroup(); const sc = scenario(g); const q = qStatus(sc.agg[my], sc.remaining);
    const playing = KO_KEYS.some((k) => { const t = koSides(k); return t.a === my || t.b === my; });
    return `<section class="card"><div class="kicker">นัดถัดไปของเรา</div>
      <h2>${playing ? 'รอผลรอบถัดไป' : 'รอประกาศคู่รอบรองชนะเลิศ'}</h2>
      ${q ? `<p>สถานะกลุ่ม ${esc(g)}: <span class="badge ${q.cls}">${esc(q.t)}</span></p>` : ''}

  }

  return `<section class="card nextm mine">
    <div class="kicker">นัดถัดไปของเรา • ${esc(item ? item.phase : next.label)}</div>
    <div class="vs">
      <div class="side me">${esc(myName())}<small>${esc(my)}</small></div>
      <div class="mid">VS<b>${next.start}</b>${esc(e.homeTzLabel)} ${homeT(next.start)}</div>
      <div class="side">${opp ? esc(tname(opp)) : 'รอประกาศ'}<small>${esc(opp || '')}${ot && ot.from ? ' • ' + esc(ot.from) : ''}</small></div>
    </div>
    <div class="info">
      <div><b>${esc(next.label)}</b> • ${esc(next.field)} • ${soon > 0 ? `อีก <b data-until="${until}">${fmtDur(soon / 1000)}</b>` : '<b>ถึงเวลาแข่งแล้ว</b>'}</div>
      ${item && item.plan ? `<div><b>แผน:</b> ${esc(item.plan)}</div>` : ''}
      ${item && item.goal ? `<div><b>เป้าหมาย:</b> ${esc(item.goal)}</div>` : ''}
      ${ot && ot.notes ? `<div><b>สเกาท์คู่แข่ง:</b> ${esc(ot.notes)}</div>` : ''}
    </div>

    <div class="btn-row">
      <button class="btn primary" data-action="go" data-tab="timer" data-tref="${next.ref}">⏱ จับเวลา / สกอร์สด</button>
      <button class="btn" data-action="go" data-tab="scores" data-key="scoresTab" data-val="${next.ref.startsWith('k:') ? 'ko' : 'group'}">บันทึกผล</button>
    </div>
  </section>`;
}

function rankLabel(r, st, i) { if (!st.played) return String(i + 1); return r.posMax > r.pos ? r.pos + '=' : String(r.pos); }
function statusBadge(code, st, sc) {
  if (!st.played) return '';
  const q = qStatus(sc.agg[code], sc.remaining);
  if (!q || (q.cls === 'warn' && sc.remaining)) return '';
  return ` <span class="badge ${q.cls}">${esc(q.t)}</span>`;
}
function miniTable(g) {
  const st = standings(g), sc = scenario(g), Q = S.event.qualify;
  return `<div class="table-wrap"><table class="st mini"><thead><tr><th>#</th><th class="team">ทีม</th><th>แข่ง</th><th>ต่าง</th><th>แต้ม</th></tr></thead><tbody>
  ${st.ranked.map((r, i) => `<tr class="${(st.played ? r.pos : i + 1) <= Q ? 'q' : ''} ${isMe(r.code) ? 'me' : ''}"><td>${rankLabel(r, st, i)}</td><td class="team">${esc(tname(r.code))}${statusBadge(r.code, st, sc)}</td><td>${r.p}</td><td>${sign(r.gd)}</td><td class="pts">${r.pts}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function scenarioMini(g) {
  const sc = scenario(g); const my = S.event.myTeam;
  if (!team(my) || team(my).group !== g) return '';
  if (!sc.myNext) {
    const q = qStatus(sc.agg[my], sc.remaining);
    return q ? `<p class="small" style="margin-top:10px">สถานะ ${esc(shortMe())}: <span class="badge ${q.cls}">${esc(q.t)}</span></p>` : '';
  }
  const opp = sc.myNext.a === my ? sc.myNext.b : sc.myNext.a;
  const outs = ['W', 'D', 'L'].map((k) => outcomeText(sc.byNext[k]));
  if (outs.every((o) => o.t === outs[0].t)) {
    return `<p class="small" style="margin:12px 0 0"><b>นัดถัดไป vs ${esc(tname(opp))}:</b> ${outs[0].cls === 'warn' ? 'ผลนัดนี้นัดเดียวยังไม่ตัดสินการเข้ารอบ — เก็บแต้มให้มากที่สุดและรักษาผลต่างประตู' : esc(outs[0].t) + ' ไม่ว่าผลจะเป็นอย่างไร'}</p>`;
  }
  return `<p class="small muted" style="margin:12px 0 4px">ถ้านัดถัดไป (vs ${esc(tname(opp))})…</p>
    <ul class="outcomes">${[['W', 'ชนะ'], ['D', 'เสมอ'], ['L', 'แพ้']].map(([k, l]) => { const o = outcomeText(sc.byNext[k]); return `<li class="${o.cls}"><b>${l}</b><span>${esc(o.t)}</span></li>`; }).join('')}</ul>`;
}

/* ---------- schedule ---------- */
function viewSchedule() {

  return `<div class="page-head"><h1>ตารางวันแข่ง</h1><p class="muted small">${esc(fmtDateTh(e.date))} • เวลาหลัก = ${esc(e.venueTzLabel)} (UTC+${e.venueTz}) • ตัวเล็ก = เวลา${esc(e.homeTzLabel)}</p></div>

}
function tlItem(it, now) {
  const s = evMs(it.start), e = evMs(it.end);

    <div class="fx-act no-print"><button class="btn sm" data-action="go" data-tab="scores" data-key="scoresTab" data-val="${ref.startsWith('k:') ? 'ko' : 'group'}">บันทึกผล</button><button class="btn sm" data-action="go" data-tab="timer" data-tref="${ref}">จับเวลา</button></div>`;
  }
  return `<li class="tl type-${esc(it.type)} ${status} ${it.done ? 'done' : ''}" id="si-${esc(it.id)}">
    <div class="tl-time"><b>${esc(it.start)}</b><span>–${esc(it.end)}</span><small>${esc(S.event.homeTzLabel)} ${homeT(it.start)}</small></div>
    <div class="tl-body">
      <div class="tl-top"><span class="chip">${esc(it.phase || '—')}</span>${status === 'now' ? '<span class="chip live">● ตอนนี้</span>' : ''}</div>
      <h3>${esc(it.title)}</h3>
      ${it.place && it.place !== '–' ? `<div class="tl-place">${esc(it.place)}</div>` : ''}
      ${fx}
      ${it.plan ? `<p class="tl-plan">${esc(it.plan)}</p>` : ''}
      ${it.goal ? `<p class="tl-goal">✓ ${esc(it.goal)}</p>` : ''}
      ${status === 'now' ? `<div class="pbar"><i data-from="${s}" data-to="${e}"></i></div>` : ''}
    </div>
    <div class="tl-side no-print"><button class="tl-check" data-action="item-done" data-id="${esc(it.id)}" aria-pressed="${!!it.done}" aria-label="ทำเครื่องหมายว่าเสร็จ: ${esc(it.title)}">✓</button>${UI.editSchedule ? `<button class="btn sm" data-action="item-edit" data-id="${esc(it.id)}">แก้ไข</button>` : ''}</div>

/* ---------- scores ---------- */
function viewScores() {
  const sub = S.ui.scoresTab || 'group';
  return seg('scoresTab', [['group', 'ผลรอบกลุ่ม'], ['table', 'ตารางคะแนน'], ['ko', 'น็อกเอาต์']], sub)

}
function subGroup() {
  const f = S.ui.groupFilter || myGroup(); const gs = groups();
  const list = S.matches.filter((m) => f === 'all' || m.group === f).sort((x, y) => byStart(x, y) || x.group.localeCompare(y.group));
  return `<div class="chips">${[...gs.map((g) => [g, 'กลุ่ม ' + g]), ['all', 'ทั้งหมด']].map(([v, l]) => `<button class="chip-btn ${v === f ? 'on' : ''}" data-action="ui" data-key="groupFilter" data-val="${esc(v)}">${esc(l)}</button>`).join('')}</div>

function liveTables(f) {
  return (f === 'all' ? groups() : [f]).map((g) => `<section class="card"><div class="row-between"><h3>ตารางคะแนนกลุ่ม ${esc(g)} (สด)</h3><span class="badge">${standings(g).played}/${standings(g).total} นัด</span></div>${miniTable(g)}</section>`).join('');
}
function matchCard(ref) {
  const m = getMatch(ref); if (!m) return '';
  const [kind, id] = ref.split(':'); const sides = sidesOf(ref);
  const mine = isMe(sides.a) || isMe(sides.b);
  const ri = resInfo(ref);
  const head = kind === 'k'
    ? `<b class="t">${esc(m.start)}</b><span class="muted">${esc(m.label)}</span>`
    : `<b class="t">${esc(m.start)}</b><span class="muted">กลุ่ม ${esc(m.group)} • สนาม ${esc(m.field)}</span>`;
  return `<article class="match ${mine ? 'mine' : ''}" data-ref="${ref}">
    <header>${head}<span class="res ${ri.cls}" data-res="${ref}">${esc(ri.t)}</span></header>
    ${teamLine(ref, 'a')}${teamLine(ref, 'b')}
    ${kind === 'k' ? `<div data-et>${etPanel(ref)}</div>` : ''}
    ${mine ? yellowLine(ref) : ''}
    ${kind === 'k' && m.action ? `<p class="ko-note">${esc(m.action)}</p>` : ''}
    ${(num(m.ga) || num(m.gb)) ? `<div class="mfoot"><button class="link" data-action="score-clear" data-ref="${ref}">ล้างผลนัดนี้</button></div>` : ''}
  </article>`;
}
function teamOptions(selected, k) {
  const pos = {};
  groups().forEach((g) => { const st = standings(g); if (st.played) st.ranked.slice(0, S.event.qualify).forEach((r, i) => { pos[r.code] = g + (i + 1); }); });
  return `<option value="">— เลือกทีม —</option>` + groups().map((g) => `<optgroup label="กลุ่ม ${esc(g)}">${S.teams.filter((t) => t.group === g).map((t) => `<option value="${esc(t.code)}" ${t.code === selected ? 'selected' : ''}>${esc(t.name)}${pos[t.code] ? ' (' + pos[t.code] + ')' : ''}</option>`).join('')}</optgroup>`).join('');
}
function teamLine(ref, side) {
  const m = getMatch(ref); const [kind, id] = ref.split(':'); const code = sidesOf(ref)[side];
  const w = winnerCode(ref); const win = !!w && w === code;
  let nameHtml;
  if (kind === 'k' && (id === 'sf1' || id === 'sf2')) {
    nameHtml = `<select data-change="ko-team" data-k="${id}" data-side="${side}" aria-label="เลือกทีม ${side.toUpperCase()} ${esc(m.label)}">${teamOptions(code, id)}</select>`;
  } else if (code) {
    const t = team(code);
    nameHtml = `${esc(t ? t.name : code)}<small>${esc(code)}${t && t.from ? ' • ' + esc(t.from) : ''}</small>`;
  } else {
    const ph = { final: ['ผู้ชนะ SF1', 'ผู้ชนะ SF2'], third: ['ผู้แพ้ SF1', 'ผู้แพ้ SF2'] }[id] || ['ทีม A', 'ทีม B'];
    nameHtml = `<span class="muted">${ph[side === 'a' ? 0 : 1]}</span>`;
  }
  const v = m['g' + side];
  const nm = code ? tname(code) : side.toUpperCase();
  const isSel = kind === 'k' && (id === 'sf1' || id === 'sf2');
  return `<div class="tline ${win ? 'win' : ''} ${isMe(code) ? 'me' : ''}" data-side="${side}"><div class="tname ${isSel ? 'sel' : ''}">${nameHtml}</div>
    <div class="stepper"><button type="button" data-action="score" data-ref="${ref}" data-side="${side}" data-d="-1" aria-label="ลดประตู ${esc(nm)}">−</button><input type="text" data-input="score" data-ref="${ref}" data-side="${side}" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" value="${num(v) ? v : ''}" placeholder="–" aria-label="ประตู ${esc(nm)}"><button type="button" data-action="score" data-ref="${ref}" data-side="${side}" data-d="1" aria-label="เพิ่มประตู ${esc(nm)}">+</button></div></div>`;
}
function etPanel(ref) {
  const m = getMatch(ref); const id = ref.split(':')[1];
  if (!hasScore(m) || m.ga !== m.gb) return '';
  const s = sidesOf(ref); const r = m.etRounds || 1;
  return `<div class="et"><b>เสมอ → ต่อเวลา 2 นาที (ยิงก่อนชนะ) • F7</b>
    <div class="et-row"><span class="small">ทีมที่ยิงประตูแรก:</span>${['a', 'b'].map((x) => `<button class="btn sm ${m.et === x ? 'on' : ''}" data-action="ko-et" data-k="${id}" data-side="${x}">${esc(s[x] ? tname(s[x]) : x.toUpperCase())}</button>`).join('')}</div>
    <div class="et-row"><span class="small">ต่อเวลารอบที่</span><div class="stepper sm"><button data-action="ko-etr" data-k="${id}" data-d="-1" aria-label="ลดรอบ">−</button><b>${r}</b><button data-action="ko-etr" data-k="${id}" data-d="1" aria-label="เพิ่มรอบ">+</button></div><span class="small muted">${r >= 2 ? 'เหลือฝ่ายละ 1 หุ่น' : 'ใช้หุ่น 2 ตัว'}</span></div></div>`;
}
function yellowLine(ref) {
  const m = getMatch(ref); const s = sidesOf(ref); const side = isMe(s.a) ? 'a' : 'b'; const n = m['y' + side] || 0; const tot = myYellow();
  return `<div class="yline"><span class="ycard" aria-hidden="true"></span><span>ใบเหลือง ${esc(shortMe())} นัดนี้</span>
    <div class="stepper sm"><button data-action="yellow" data-ref="${ref}" data-side="${side}" data-d="-1" aria-label="ลดใบเหลือง">−</button><b>${n}</b><button data-action="yellow" data-ref="${ref}" data-side="${side}" data-d="1" aria-label="เพิ่มใบเหลือง">+</button></div>
    <span class="small ${tot >= 3 ? 'danger-text' : 'muted'}">รวมทั้งรายการ ${tot}/4</span></div>`;
}
function subTable() {
  const my = myGroup();
  return groups().slice().sort((a, b) => (a === my ? -1 : b === my ? 1 : a.localeCompare(b))).map((g) => fullTable(g) + (g === my ? scenarioCard(g) : '')).join('')
    + `<section class="card"><h3>เกณฑ์การจัดอันดับ</h3><ul class="plain">${S.groupNotes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></section>`;
}
function fullTable(g) {
  const st = standings(g), sc = scenario(g), Q = S.event.qualify;
  const notes = st.played ? st.notes.filter((n) => n.by !== 'pending' && (n.x.p || n.y.p)) : [];
  return `<section class="card"><div class="row-between"><h2>กลุ่ม ${esc(g)}</h2><span class="badge ${st.complete ? 'ok' : ''}">${st.complete ? 'จบรอบกลุ่ม' : `แข่งแล้ว ${st.played}/${st.total} นัด`}</span></div>
  <div class="table-wrap"><table class="st"><thead><tr><th>#</th><th class="team">ทีม</th><th>แข่ง</th><th>ชนะ</th><th>เสมอ</th><th>แพ้</th><th class="xs-hide">ได้</th><th class="xs-hide">เสีย</th><th>ต่าง</th><th>แต้ม</th></tr></thead><tbody>
  ${st.ranked.map((r, i) => `<tr class="${(st.played ? r.pos : i + 1) <= Q ? 'q' : ''} ${isMe(r.code) ? 'me' : ''}"><td>${rankLabel(r, st, i)}</td><td class="team">${esc(tname(r.code))} <small>${esc(r.code)}</small>${statusBadge(r.code, st, sc)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class="xs-hide">${r.gf}</td><td class="xs-hide">${r.ga}</td><td>${sign(r.gd)}</td><td class="pts">${r.pts}</td></tr>`).join('')}

function tPhases() { const p = PRESETS[T.preset] || PRESETS.group; return p.phases || [['พัก / ซ่อมหุ่น', Math.max(1, Math.min(180, T.custom | 0)) * 60, 'break']]; }
function tRem() { return T.running ? Math.max(0, (T.endAt - Date.now()) / 1000) : T.remaining; }

function timerMatchOptions() {

  KO_KEYS.forEach((k) => { const t = koSides(k); opts.push({ ref: 'k:' + k, label: `${S.ko[k].start} ${S.ko[k].label}: ${t.a ? tname(t.a) : '?'} vs ${t.b ? tname(t.b) : '?'}`, mine: isMe(t.a) || isMe(t.b) }); });

}
function defaultTimerRef() { const n = myFixtures().find((f) => !f.done); return n ? n.ref : ('g:' + (S.matches[0] ? S.matches[0].id : '')); }
function viewTimer() {

  const cur = done ? ['จบการแข่งขัน', 1, 'end'] : ph[T.idx];

  return `${seg('preset', Object.entries(PRESETS).map(([k, v]) => [k, v.name]), T.preset, 't-preset', 'grid')}
  <section class="card timer ${cur[2]}" id="timer-card">

    <div class="t-ctrl2"><button class="btn sm" data-action="t-reset">↺ เริ่มใหม่ทั้งแมตช์</button><button class="btn sm" data-action="t-next">⏭ ข้ามไปช่วงถัดไป</button><button class="btn sm" data-action="t-sound" aria-pressed="${!!T.sound}">${T.sound ? '🔔 เสียงเตือน: เปิด' : '🔕 เสียงเตือน: ปิด'}</button></div>

const VIEWS = { home: viewHome, schedule: viewSchedule, scores: viewScores, timer: viewTimer, plan: viewPlan };

/* ------------------------------------------------------------------
 * Render / routing
 * ------------------------------------------------------------------ */
function render() {
  const tab = VIEWS[S.ui.tab] ? S.ui.tab : 'home';
  $('#view').innerHTML = VIEWS[tab]();
  $$('.tabbar a').forEach((a) => { const on = a.dataset.tab === tab; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#brand-name').textContent = myName();
  $('#brand-sub').textContent = S.event.title;
  $('#clk-v-l').textContent = S.event.venueTzLabel;
  $('#clk-h-l').textContent = S.event.homeTzLabel;
  lastAutoRender = Date.now();
  renderedIdx = T.idx;
  tick(true);
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function route() {
  const h = (location.hash || '').slice(1);
  const tab = VIEWS[h] ? h : 'home';
  if (S.ui.tab !== tab) { S.ui.tab = tab; save(); }
  render(); window.scrollTo(0, 0);
  if (tab === 'schedule') scrollToNow();
}
function scrollToNow() {
  const el = $('.tl.now') || ($('.tl.past') && $('.tl.future'));
  if (el) el.scrollIntoView({ block: 'center' });
}
function navigate(tab) {
  if (location.hash === '#' + tab) { S.ui.tab = tab; save(); render(); window.scrollTo(0, 0); if (tab === 'schedule') scrollToNow(); }
  else location.hash = tab;
}

let toastTimer = null;
function toast(msg, undo = false) {

function summaryText() {
  const e = S.event; const L = [];
  L.push(`🏆 ${myName()} | ${e.title}`);
  L.push(`${e.name} • ${e.category}`);
  L.push(`📅 ${fmtDateTh(e.date)} (เวลา${e.venueTzLabel})`);
  const pl = myPlacement(); if (pl) L.push(`ผลงาน: ${pl}`);
  const my = myGroup();
  groups().slice().sort((a, b) => (a === my ? -1 : b === my ? 1 : a.localeCompare(b))).forEach((g) => {
    const st = standings(g);
    L.push(''); L.push(`⚽ รอบกลุ่ม ${g} (แข่งแล้ว ${st.played}/${st.total})`);
    gMatches(g).slice().sort(byStart).forEach((m) => L.push(`${m.start}  ${tname(m.a)} ${hasScore(m) ? m.ga + '–' + m.gb : 'vs'} ${tname(m.b)}`));
    if (st.played) {
      L.push(`📊 ตารางคะแนนกลุ่ม ${g}`);
      st.ranked.forEach((r) => L.push(`${r.posMax > r.pos ? r.pos + '=' : r.pos}. ${tname(r.code)} — ${r.pts} แต้ม (แข่ง ${r.p} ต่าง ${sign(r.gd)})`));
    }
  });
  const koLines = KO_KEYS.map((k) => {
    const t = koSides(k), m = S.ko[k];
    if (!t.a && !t.b) return null;
    let s = `${m.label}: ${t.a ? tname(t.a) : '?'} ${hasScore(m) ? m.ga + '–' + m.gb : 'vs'} ${t.b ? tname(t.b) : '?'}`;
    if (hasScore(m) && m.ga === m.gb && koWin(k)) s += ` (ต่อเวลา: ${tname(koWin(k))} ชนะ)`;
    return s;
  }).filter(Boolean);
  if (koLines.length) { L.push(''); L.push('🏁 รอบน็อกเอาต์'); koLines.forEach((x) => L.push(x)); }
  if (koWin('final')) L.push(`🏆 แชมป์: ${tname(koWin('final'))}`);
  L.push(''); L.push(`🟨 ใบเหลือง ${shortMe()}: ${myYellow()}/4`);
  return L.join('\n');
}
async function copyText(t) {

  const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); let ok = false;

  ta.remove(); return ok;
}
function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; } }
function beep(freq, dur, vol) {
  if (!T.sound || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime;
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.18, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) { /* ignore */ }
}
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

    unlockAudio();
    const ph = tPhases();
    if (T.running) { T.remaining = tRem(); T.running = false; keepAwake(false); }
    else {
      if (T.idx >= ph.length) { T.idx = 0; T.remaining = ph[0][1]; }
      if (T.remaining <= 0) T.remaining = ph[T.idx][1];
      T.endAt = Date.now() + T.remaining * 1000; T.running = true; keepAwake(true);
    }
    lastBeepSec = null; saveT(); rerender();
  },
  't-reset'() { tSetPreset(T.preset); rerender(); },
  't-next'() {
    const ph = tPhases();
    T.running = false; keepAwake(false);
    if (T.idx < ph.length - 1) { T.idx++; T.remaining = ph[T.idx][1]; } else { T.idx = ph.length; T.remaining = 0; }
    saveT(); rerender();
  },
  't-adj'(el) {
    const d = +el.dataset.d;
    if (T.running) T.endAt = Math.max(Date.now(), T.endAt + d * 1000);
    else if (T.idx < tPhases().length) T.remaining = Math.max(0, T.remaining + d);
    saveT(); tick(true);
  },
  't-sound'() { T.sound = !T.sound; if (T.sound) { unlockAudio(); beep(880, 0.08); } saveT(); rerender(); },
};

/* อัปเดตเฉพาะส่วนที่เกี่ยวข้อง โดยไม่ทำลายช่องที่กำลังพิมพ์อยู่ */
function softRefresh(keepRef) {
  const act = document.activeElement;
  $$('.match[data-ref]').forEach((card) => {
    const ref = card.dataset.ref;
    if (!card.contains(act) && ref !== keepRef) { card.outerHTML = matchCard(ref); return; }
    const ri = resInfo(ref); const r = card.querySelector('[data-res]');
    if (r) { r.textContent = ri.t; r.className = 'res ' + ri.cls; }
    const w = winnerCode(ref); const sd = sidesOf(ref);
    card.querySelectorAll('.tline[data-side]').forEach((tl) => tl.classList.toggle('win', !!w && w === sd[tl.dataset.side]));
    const et = card.querySelector('[data-et]'); if (et) et.innerHTML = etPanel(ref);
  });
  const lt = $('#live-table'); if (lt) lt.innerHTML = liveTables(S.ui.groupFilter || myGroup());
  const cs = $('#champ-slot'); if (cs) cs.innerHTML = champBanner();
}
const INPUTS = {
  score(el) {
    const raw = el.value.replace(/\D/g, '').slice(0, 2);
    if (raw !== el.value) el.value = raw;
    const m = getMatch(el.dataset.ref); if (!m) return;
    m['g' + el.dataset.side] = raw === '' ? null : +raw;
    save(); softRefresh(el.dataset.ref);
  },
  'team-notes'(el) { const t = team(el.dataset.code); if (t) { t.notes = el.value; save(); } },
};
const CHANGES = {
  'ko-team'(el) {
    const k = el.dataset.k, side = el.dataset.side, v = el.value;
    const used = ['sf1', 'sf2'].flatMap((x) => ['a', 'b'].map((s) => (x === k && s === side) ? '' : S.ko[x][s])).filter(Boolean);
    S.ko[k][side] = v; save(); rerender();
    if (v && used.includes(v)) toast(`⚠ ${tname(v)} ถูกเลือกในอีกนัดแล้ว`);
  },
  't-ref'(el) { T.ref = el.value; if (!T.running) { const p = presetFor(T.ref); if (p !== T.preset) tSetPreset(p); } saveT(); rerender(); },
  't-custom'(el) { T.custom = Math.max(1, Math.min(180, parseInt(el.value, 10) || 15)); if (!T.running) { T.idx = 0; T.remaining = tPhases()[0][1]; } saveT(); rerender(); },
  set(el) {
    const path = el.dataset.path.split('.'); let o = S;
    for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    const v = el.value.trim(); if (!v) return;
    o[path[path.length - 1]] = v; save(); rerender();
  },
  theme(el) { S.ui.theme = el.value; save(); applyTheme(); },
};
const SUBMITS = {
  'check-add'(f) {
    const inp = f.elements.t; const t = inp.value.trim(); if (!t) return;
    S.checklists[f.dataset.list].push({ id: uid(), text: t, done: false }); save(); rerender();
    const again = $(`form[data-list="${f.dataset.list}"] input`); if (again) again.focus();
  },
  'item-save'(f) {
    const v = (n) => (f.elements[n] ? f.elements[n].value.trim() : '');
    const data = { start: v('start'), end: v('end'), phase: v('phase'), title: v('title'), place: v('place'), plan: v('plan'), goal: v('goal'), type: v('type') || 'admin', link: v('link') };
    if (!data.start || !data.end || !data.title) return;
    if (toMin(data.end) <= toMin(data.start)) { toast('เวลาสิ้นสุดต้องหลังเวลาเริ่ม'); return; }
    snapshot();
    if (f.dataset.id) Object.assign(S.schedule.find((i) => i.id === f.dataset.id), data);
    else S.schedule.push({ id: 's' + uid(), done: false, ...data });
    save(); closeModal(); rerender(); toast('บันทึกรายการแล้ว', true);
  },
  'team-save'(f) {
    const t = team(f.dataset.code); if (!t) return;
    const name = f.elements.name.value.trim(); if (!name) return;
    t.name = name; t.from = f.elements.from.value.trim(); t.notes = f.elements.notes.value;
    save(); closeModal(); rerender(); toast('บันทึกข้อมูลทีมแล้ว');
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el, e); });
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e); });
document.addEventListener('submit', (e) => { const f = e.target; const k = f.dataset && f.dataset.submit; if (!k) return; e.preventDefault(); if (SUBMITS[k]) SUBMITS[k](f); });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches && e.target.matches('input[data-input="score"]')) e.target.blur(); });
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
$('#file-import').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(String(r.result)); const d = parsed && parsed.data ? parsed.data : parsed;
      if (!validData(d)) throw new Error('bad');
      if (!confirm('นำเข้าข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันในเครื่องจะถูกแทนที่')) return;
      snapshot(); const theme = S.ui.theme; S = merge(DEFAULTS(), d); S.ui.theme = theme; S.version = DATA_VERSION;
      save(); closeModal(); applyTheme(); rerender(); toast('นำเข้าข้อมูลแล้ว', true);
    } catch (err) { toast('ไฟล์ไม่ถูกต้อง — ใช้ไฟล์ .json ที่ได้จาก “สำรองข้อมูล”'); }
  };
  r.readAsText(file);
});
window.addEventListener('hashchange', route);
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener('storage', (e) => { if (e.key === KEY || e.key === TKEY) { load(); memo.clear(); applyTheme(); if (!modalOpen()) rerender(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (T.running) keepAwake(true); tick(true); } });

function applyTheme() {
  const t = S.ui.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}

/* ------------------------------------------------------------------
 * Clock tick
 * ------------------------------------------------------------------ */
let lastSec = -1, lastAutoRender = 0, lastBeepSec = null, renderedIdx = null;
function phaseEnd() {
  const ph = tPhases(); const ended = ph[T.idx] ? ph[T.idx][0] : '';
  T.running = false; T.remaining = 0; keepAwake(false);
  beep(520, 0.9, 0.22); try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) { /* ignore */ }
  if (T.idx < ph.length - 1) { T.idx++; T.remaining = ph[T.idx][1]; toast(`หมดเวลา “${ended}” → ถัดไป: ${ph[T.idx][0]} (กด ▶ เมื่อกรรมการสั่ง)`); }
  else { T.idx = ph.length; toast('หมดเวลาการแข่งขัน — ตรวจสกอร์ก่อนเซ็นใบคะแนน'); }
  saveT();
  if (S.ui.tab === 'timer') rerender();
}
function tick(force) {
  const now = Date.now();
  const rem = tRem();
  if (T.running) {
    const s = Math.ceil(rem);
    if (s !== lastBeepSec) { lastBeepSec = s; if (s === 30 || s === 10) beep(660, 0.18); else if (s >= 1 && s <= 3) beep(880, 0.12); }
    if (rem <= 0) { phaseEnd(); return; }
  }
  const ph = tPhases(); const done = T.idx >= ph.length; const cur = done ? null : ph[T.idx];
  const big = $('#t-big');
  if (big) {
    if (renderedIdx !== T.idx && S.ui.tab === 'timer') { rerender(); return; }
    big.textContent = fmtMS(done ? 0 : rem);
    const bar = $('#t-bar'); if (bar) bar.style.width = (cur ? Math.max(0, Math.min(100, (1 - rem / cur[1]) * 100)) : 100) + '%';
    const card = $('#timer-card'); if (card) card.classList.toggle('low', T.running && rem <= 10);
  }
  const pill = $('#tpill');
  const showPill = T.running && S.ui.tab !== 'timer' && cur;
  pill.hidden = !showPill;
  if (showPill) pill.textContent = `⏱ ${cur[0]} ${fmtMS(rem)}`;

  const sec = Math.floor(now / 1000);
  if (sec === lastSec && !force) return;
  lastSec = sec;
  $('#clk-v').textContent = clockStr(S.event.venueTz);
  $('#clk-h').textContent = clockStr(S.event.homeTz);
  let expired = false;
  $$('[data-until]').forEach((el) => { const left = (+el.dataset.until - now) / 1000; if (left <= 0 && left > -3) expired = true; el.textContent = fmtDur(left); });
  $$('[data-from]').forEach((el) => { const f = +el.dataset.from, t = +el.dataset.to; el.style.width = Math.max(0, Math.min(100, ((now - f) / (t - f)) * 100)) + '%'; });
  $$('[data-clock]').forEach((el) => { el.textContent = clockStr(S.event.venueTz); });
  const idle = !modalOpen() && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if (!force && idle && (S.ui.tab === 'home' || S.ui.tab === 'schedule') && (expired || now - lastAutoRender > 30000)) rerender();
}

/* ------------------------------------------------------------------
 * Boot
 * ------------------------------------------------------------------ */
load();
applyTheme();
if (!VIEWS[(location.hash || '').slice(1)]) history.replaceState(null, '', '#' + (VIEWS[S.ui.tab] ? S.ui.tab : 'home'));
route();
setInterval(tick, 250);
if (T.running) keepAwake(true);
if (location.protocol.startsWith('http')) {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
window.CWK = { state: () => S, standings, scenario, summaryText };
})();
</script>
