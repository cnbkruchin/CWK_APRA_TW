<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CWK Championship Planner</title>
<meta name="description" content="ระบบวางแผนการแข่งขัน CWK JAEGER ROBOT • APRA International Final 2026 • SPIKE Remote Soccer – Junior">
<meta name="theme-color" content="#1f2a44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CWK APRA">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Cdefs%3E%3CclipPath id=%22b%22%3E%3Ccircle cx=%22256%22 cy=%22256%22 r=%22170%22/%3E%3C/clipPath%3E%3C/defs%3E%3Crect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22%23b51f32%22/%3E%3Ccircle cx=%22256%22 cy=%22256%22 r=%22170%22 fill=%22%23fff%22/%3E%3Cg clip-path=%22url%28%23b%29%22 fill=%22%231f2a44%22%3E%3Cpath d=%22M256 196L313 237.5 291.3 304.5H220.7L198.9 237.5Z%22/%3E%3Cpath d=%22M256 128 208.4 93.5 226.6 37.5 285.4 37.5 303.6 93.5ZM377.7 216.4 395.9 160.5 454.7 160.5 472.8 216.4 425.3 251ZM331.2 359.6 390 359.6 408.2 415.5 360.6 450 313.1 415.5ZM180.8 359.6 198.9 415.5 151.4 450 103.8 415.5 122 359.6ZM134.3 216.4 86.7 251 39.2 216.4 57.3 160.5 116.1 160.5Z%22/%3E%3C/g%3E%3Cpath d=%22M256 196V128M313 237.5L377.7 216.4M291.3 304.5L331.2 359.6M220.7 304.5L180.8 359.6M198.9 237.5L134.3 216.4%22 stroke=%22%231f2a44%22 stroke-width=%2214%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%22256%22 cy=%22256%22 r=%22170%22 fill=%22none%22 stroke=%22%231f2a44%22 stroke-width=%2210%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#f5f7fa; --text:#1b2333; --muted:#5b6578; --border:#dce1ea;
  --brand:#1f2a44; --brand-2:#33456f; --on-brand:#ffffff;
  --accent:#b51f32; --accent-ink:#ffffff; --accent-soft:#fbe8ea;
  --ok:#1b7a45; --ok-soft:#e3f3e9; --warn:#935d00; --warn-soft:#fff2d9;
  --info:#2c5bb0; --info-soft:#e7eefb; --gold:#a87400; --gold-soft:#fff4d6; --purple:#6f45b0;
  --mine:#fff6e7; --sel:#1f2a44; --sel-ink:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:14px; --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d121d; --surface:#151c2b; --surface-2:#1c2436; --text:#e6eaf2; --muted:#9aa4b7; --border:#2a3447;
    --brand:#0a1020; --brand-2:#1d2a48; --on-brand:#ffffff;
    --accent:#ff5d70; --accent-ink:#1a0005; --accent-soft:#3b1820;
    --ok:#4fc483; --ok-soft:#14301f; --warn:#f0b64a; --warn-soft:#33270e;
    --info:#7ea6ff; --info-soft:#18243f; --gold:#f2c14e; --gold-soft:#33290f; --purple:#b393f0;
    --mine:#2a2516; --sel:#e6eaf2; --sel-ink:#0d121d;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d121d; --surface:#151c2b; --surface-2:#1c2436; --text:#e6eaf2; --muted:#9aa4b7; --border:#2a3447;
  --brand:#0a1020; --brand-2:#1d2a48; --on-brand:#ffffff;
  --accent:#ff5d70; --accent-ink:#1a0005; --accent-soft:#3b1820;
  --ok:#4fc483; --ok-soft:#14301f; --warn:#f0b64a; --warn-soft:#33270e;
  --info:#7ea6ff; --info-soft:#18243f; --gold:#f2c14e; --gold-soft:#33290f; --purple:#b393f0;
  --mine:#2a2516; --sel:#e6eaf2; --sel-ink:#0d121d;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 "Noto Sans Thai","Sukhumvit Set","Leelawadee UI","Thonburi","Sarabun",Tahoma,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);-webkit-tap-highlight-color:transparent}
a{color:var(--info)}
button{font:inherit;color:inherit}
.tnum,.t-big,.bscore,.clocks b,.st td{font-variant-numeric:tabular-nums}
h1{font-size:22px;line-height:1.3;margin:0 0 4px}
h2{font-size:18px;line-height:1.35;margin:0 0 8px}
h3{font-size:16px;line-height:1.4;margin:0 0 8px}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px} .danger-text{color:var(--accent);font-weight:700}
.kicker{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.spacer{flex:1}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
ul.plain{margin:0;padding-left:18px} ul.plain li{margin-bottom:6px;font-size:14px}
.sec{margin:18px 2px 10px;font-size:15px;color:var(--muted)}

/* app bar */
.appbar{position:sticky;top:0;z-index:30;background:var(--brand);color:var(--on-brand);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;color:inherit;text-decoration:none}
.brand svg{width:34px;height:34px;flex:none;border-radius:9px}
.brand-text{min-width:0}
.brand b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clocks{display:flex;gap:10px;flex:none}
.clocks div{text-align:center;line-height:1.1}
.clocks small{display:block;font-size:10.5px;opacity:.72}
.clocks b{font-size:16px}
.icon-btn{background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:rgba(127,127,127,.15)}
.icon-btn svg{width:22px;height:22px}

main{max-width:940px;margin:0 auto;padding:16px}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);text-decoration:none;padding:4px 2px;border-radius:10px;min-width:0;white-space:nowrap}
.tabbar a svg{width:24px;height:24px}
.tabbar a.on{color:var(--accent);font-weight:700}
@media (min-width:760px){
  .tabbar{left:50%;right:auto;transform:translateX(-50%);bottom:12px;width:560px;border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:6px}
  body{padding-bottom:110px}
}
svg.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* generic */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px;border-radius:9px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.btn.danger{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger-outline{color:var(--accent);border-color:var(--accent);background:transparent}
.link{background:none;border:0;color:var(--info);font-weight:700;font-size:13.5px;cursor:pointer;padding:6px 0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:middle;white-space:nowrap;border:1px solid var(--border)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.bad{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:var(--brand-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--brand-2)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;min-height:38px}
.chip-btn.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.chip.live{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pbar{height:7px;background:rgba(127,127,127,.2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s}

input:not([type=checkbox]):not([type=radio]),select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;min-height:42px;width:100%;max-width:100%}
textarea{resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb, var(--info) 55%, transparent);outline-offset:1px}
.form{display:grid;gap:12px}
.form label,label.field{display:grid;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:6px}

/* hero */
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;border:20px solid #b51f32;opacity:.45;pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .kicker{color:rgba(255,255,255,.78)}
.hero h1{font-size:24px;margin-bottom:2px}
.hero .sub{opacity:.85;font-size:14.5px}
.hero .cd{margin-top:14px}
.hero .cd span{font-size:13.5px;opacity:.85}
.hero .cd b{display:block;font-size:30px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero .tags span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.hero .pbar{background:rgba(255,255,255,.22)} .hero .pbar i{background:#ff6b7d}
.hero .next{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2);font-size:14.5px}
.hero .plan{margin-top:8px;font-size:14.5px;opacity:.92}
.hero .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}

/* next match */
.nextm .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:10px 0 12px}
.nextm .side{font-weight:800;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.nextm .side small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.nextm .side.me{color:var(--accent)}
.nextm .mid{font-size:13px;color:var(--muted);line-height:1.25}
.nextm .mid b{display:block;font-size:22px;color:var(--text)}
.nextm .info{display:grid;gap:6px;font-size:14.5px;margin-bottom:10px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.alert.bad{background:var(--accent-soft);color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;color:var(--text);text-decoration:none;box-shadow:var(--shadow);min-width:0}
.tile .tk{font-size:12.5px;color:var(--muted);font-weight:700}
.tile b{font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile b small{font-size:15px;color:var(--muted);font-weight:600}
.tile .ts{font-size:12px;color:var(--muted)}
.tile.warn{border-color:var(--warn)} .tile.warn b{color:var(--warn)}
.tile.bad{border-color:var(--accent);background:var(--accent-soft)} .tile.bad b{color:var(--accent)}

/* matches */
.match{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.match.mine{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.match header{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px;flex-wrap:wrap}
.match header .t{font-size:15px}
.res{margin-left:auto;font-weight:700;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.res.ok{background:var(--ok-soft);color:var(--ok)} .res.bad{background:var(--accent-soft);color:var(--accent)} .res.warn{background:var(--warn-soft);color:var(--warn)}
.tline{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--border)}
.match header + .tline{border-top:0}
.tname{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere;line-height:1.3}
.tname small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.tname select{font-weight:700}
.tname.sel{display:flex;align-items:center;gap:4px}
.tname.sel select{flex:1;min-width:0}
.seg.grid{display:grid;grid-template-columns:1fr 1fr;overflow:visible}
@media (min-width:560px){.seg.grid{grid-template-columns:repeat(4,1fr)}}
.tline.win .tname{font-weight:800}
.tline.win .tname::before{content:"✓ ";color:var(--ok)}
.tline.me .tname{color:var(--accent)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:42px;height:42px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:21px;font-weight:800;cursor:pointer;line-height:1;padding:0}
.stepper button:active{transform:scale(.95)}
.stepper input{width:50px !important;height:42px;text-align:center;border:1px solid var(--border);border-radius:11px;background:var(--mine) !important;font-size:21px !important;font-weight:800;padding:0 !important}
.stepper.sm button{width:32px;height:32px;font-size:17px;border-radius:9px}
.stepper.sm b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.yline{display:flex;align-items:center;gap:8px;padding-top:8px;margin-top:4px;border-top:1px dashed var(--border);font-size:13.5px;flex-wrap:wrap}
.ycard{display:inline-block;width:13px;height:18px;border-radius:2px;background:#f4c430;box-shadow:0 0 0 1px rgba(0,0,0,.15);vertical-align:middle;flex:none}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ko-note{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.et{background:var(--warn-soft);border-radius:10px;padding:9px 11px;margin-top:8px;font-size:13.5px;display:grid;gap:7px}
.et-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.st{width:100%;border-collapse:collapse;font-size:14px}
.st th,.st td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.st th{font-size:12px;color:var(--muted);font-weight:700}
.st .team{text-align:left;white-space:normal;min-width:130px;line-height:1.3}
.st .team small{color:var(--muted);font-size:11.5px}
.st tbody tr.q td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.st tbody tr.me{background:var(--mine)}
.st tbody tr.me .team{color:var(--accent);font-weight:700}
.st .pts{font-weight:800;font-size:15px}
@media (max-width:519px){.st .xs-hide{display:none}.st .team{min-width:96px}.st th,.st td{padding:8px 4px}}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px}
.tie-notes{margin:10px 0 0;padding:10px 12px;background:var(--info-soft);border-radius:10px;font-size:13.5px}
.tie-notes li{margin:2px 0}
.outcomes{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.outcomes li{display:flex;gap:10px;align-items:baseline;padding:8px 11px;border-radius:10px;background:var(--surface-2);font-size:14.5px}
.outcomes li b{min-width:44px}
.outcomes li.ok{background:var(--ok-soft)} .outcomes li.ok b{color:var(--ok)}
.outcomes li.warn{background:var(--warn-soft)} .outcomes li.warn b{color:var(--warn)}
.outcomes li.bad{background:var(--accent-soft)} .outcomes li.bad b{color:var(--accent)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.qgrid .q{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.qgrid .q.me{background:var(--mine);color:var(--accent)}
.bracket{display:grid;gap:0 14px}
@media (min-width:760px){.bracket{grid-template-columns:1fr 1fr}}
.champ{background:linear-gradient(135deg,#6b4a00,#a87400);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px}
.champ .kicker{color:rgba(255,255,255,.8)}
.champ h2{font-size:22px;margin:0}

/* timeline */
.timeline{list-style:none;margin:0;padding:0}
.tl{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--c,var(--border));border-radius:13px;padding:12px 10px 12px 11px;margin-bottom:8px;box-shadow:var(--shadow)}
.tl.type-match{--c:var(--accent)} .tl.type-ko{--c:var(--gold)} .tl.type-rest{--c:var(--ok)} .tl.type-admin{--c:var(--info)} .tl.type-practice{--c:var(--purple)}
.tl.type-match,.tl.type-ko{background:linear-gradient(90deg,var(--mine),var(--surface) 70%)}
.tl.past{opacity:.62}
.tl.now{box-shadow:0 0 0 2px var(--accent);opacity:1}
.tl-time{line-height:1.2}
.tl-time b{font-size:16.5px;display:block}
.tl-time span{display:block;font-size:12.5px;color:var(--muted)}
.tl-time small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.tl-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.tl h3{margin:0 0 2px;font-size:15.5px}
.tl-place{font-size:13px;color:var(--muted)}
.tl-plan{font-size:14px;margin:6px 0 2px}
.tl-goal{font-size:13.5px;color:var(--ok);margin:0;font-weight:600}
.tl.done h3{text-decoration:line-through;text-decoration-color:var(--muted)}
.tl-side{display:flex;flex-direction:column;gap:6px;align-items:center}
.tl-check{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:transparent;color:transparent;cursor:pointer;font-size:18px;font-weight:800;padding:0}

.fx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-weight:700;font-size:14px}

.timer{text-align:center}

.ph{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600}
.ph.cur{background:var(--sel);color:var(--sel-ink)}
.ph.done{text-decoration:line-through;opacity:.7}
.t-label{font-size:18px;font-weight:800;margin-top:8px}

.timer.play .t-big,.timer.play .t-label{color:var(--accent)}

.timer.prep .t-big,.timer.prep .t-label{color:var(--info)}

.inline{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:700;font-size:14px}
.inline input{width:90px !important}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;margin:12px 0}
.bside{background:var(--surface-2);border-radius:14px;padding:10px;text-align:center;min-width:0;border:1px solid var(--border)}
.bside.me{border:2px solid var(--accent)}

.bside.me .bname{color:var(--accent)}
.bscore{font-size:60px;font-weight:800;line-height:1.1}
.bbtns{display:flex;gap:6px}
.bbtns .btn{flex:1;min-height:52px;font-size:20px;padding:4px}
.bsep{font-size:40px;font-weight:800;padding-top:48px;color:var(--muted)}
.ymini{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:13px}

/* play */
.play h2{font-size:22px}

.robot p{font-size:16px;font-weight:600;margin:0}
.caution{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:14.5px;margin-bottom:8px}
.kpi{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:14.5px}
.caution b,.kpi b{margin-right:6px}

.pb-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}

.rule:last-child{border-bottom:0}
.rule .ref{font-weight:800;font-size:13px;color:var(--info)}
.rule .cat{font-weight:800;font-size:14.5px}
.rule p{margin:2px 0 8px;font-size:14.5px}
.rstat{display:flex;gap:6px;flex-wrap:wrap}
.rstat button{font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;min-height:34px}
.rstat button.on.pass{background:var(--ok);border-color:var(--ok);color:#fff}
.rstat button.on.check{background:var(--warn);border-color:var(--warn);color:#fff}
.rstat button.on.fail{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.checks li:last-child{border-bottom:0}

.add-row{display:flex;gap:8px;margin-top:10px}

.vsline{font-size:13.5px;margin:6px 0;font-weight:600}

dialog{border:0;border-radius:18px;padding:0;max-width:580px;width:calc(100% - 24px);background:var(--surface);color:var(--text);box-shadow:0 24px 60px rgba(0,0,0,.35)}

#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:transparent;border:0;color:#ffb1bb;font-weight:800;cursor:pointer;padding:4px;white-space:nowrap}

.robar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--info-soft);color:var(--info);border-radius:12px;padding:6px 12px;margin-bottom:12px;font-size:13.5px;font-weight:700}
.robar .link{white-space:nowrap}
.netbox{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:grid;gap:2px}

.ro .edit-hint{display:none}

.mplay{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}

    A.p++; B.p++; A.gf += m.ga; A.ga += m.gb; B.gf += m.gb; B.ga += m.ga;
    const res = m.ga > m.gb ? 'a' : m.ga < m.gb ? 'b' : 'd';

function scenario(g) {

  if (b.worst <= Q) return { cls: 'ok', t: b.best === 1 ? `เข้ารอบแน่นอน (อันดับ 1–${b.worst})` : 'เข้ารอบแน่นอน' };
  if (b.best > Q) return { cls: 'bad', t: 'ตกรอบแน่นอน' };
  return { cls: 'warn', t: `ยังไม่แน่นอน (อันดับ ${b.best}–${b.worst}) ขึ้นกับคู่อื่น/ผลต่างประตู` };
}
function tieText(n) {
  if (n.by === 'h2h') return `ผลพบกันเอง (${n.x.h2h} ต่อ ${n.y.h2h} แต้ม)`;
  if (n.by === 'gd') return `ผลต่างประตู (${sign(n.x.gd)} ต่อ ${sign(n.y.gd)})`;
  if (n.by === 'gf') return `ประตูได้ (${n.x.gf} ต่อ ${n.y.gf})`;
  return 'เท่ากันทุกเกณฑ์ — ปรึกษากรรมการ';
}
function resInfo(ref) {
  const m = getMatch(ref); const [kind, id] = ref.split(':'); const s = sidesOf(ref);
  if (!m) return { t: '', cls: '' };
  if (!num(m.ga) && !num(m.gb)) return { t: 'ยังไม่แข่ง', cls: '' };
  if (!hasScore(m)) return { t: 'กรอกไม่ครบ', cls: 'warn' };
  const mySide = isMe(s.a) ? 'a' : isMe(s.b) ? 'b' : null;
  const w = kind === 'g' ? (m.ga > m.gb ? 'a' : m.gb > m.ga ? 'b' : 'd') : (koSide(id) || 'd');
  const et = kind === 'k' && m.ga === m.gb && (m.et === 'a' || m.et === 'b');
  if (kind === 'k' && w === 'd') return { t: 'เสมอ → ต่อเวลา', cls: 'warn' };
  if (mySide) {
    if (w === 'd') return { t: 'เสมอ +1', cls: 'warn' };
    if (w === mySide) return { t: kind === 'g' ? 'ชนะ +3' : (et ? 'ชนะ (ต่อเวลา)' : 'ชนะ'), cls: 'ok' };
    return { t: et ? 'แพ้ (ต่อเวลา)' : 'แพ้', cls: 'bad' };
  }
  if (w === 'd') return { t: 'เสมอ', cls: '' };
  return { t: `${s[w] || w.toUpperCase()} ชนะ${et ? ' (ต่อเวลา)' : ''}`, cls: '' };
}

/* ------------------------------------------------------------------
 * Day status
 * ------------------------------------------------------------------ */
function dayStatus() {
  const items = sortedSchedule(); const now = Date.now();
  if (!items.length) return { mode: 'empty' };
  const first = items[0], last = items.reduce((a, b) => (toMin(b.end) > toMin(a.end) ? b : a), items[0]);
  const startMs = evMs(first.start), endMs = evMs(last.end);
  if (now < startMs) return { mode: 'before', first, startMs };
  if (now >= endMs) return { mode: 'after' };
  const cur = items.find((i) => evMs(i.start) <= now && now < evMs(i.end)) || null;
  const next = items.find((i) => evMs(i.start) > now) || null;
  return { mode: 'during', cur, next };
}

function teamLine(ref, side) {

/* ---------- timer ---------- */
function tPhases() { const p = PRESETS[T.preset] || PRESETS.group; return p.phases || [['พัก / ซ่อมหุ่น', Math.max(1, Math.min(180, T.custom | 0)) * 60, 'break']]; }
function tRem() { return T.running ? Math.max(0, (T.endAt - Date.now()) / 1000) : T.remaining; }
function tSetPreset(p) { T.preset = PRESETS[p] ? p : 'group'; T.idx = 0; T.running = false; T.remaining = tPhases()[0][1]; saveT(); keepAwake(false); }
function timerMatchOptions() {
  const opts = [];
  S.matches.slice().sort((x, y) => byStart(x, y) || x.group.localeCompare(y.group)).forEach((m) => opts.push({ ref: 'g:' + m.id, label: `${m.start} กลุ่ม ${m.group}: ${tname(m.a)} vs ${tname(m.b)}`, mine: isMe(m.a) || isMe(m.b) }));
  KO_KEYS.forEach((k) => { const t = koSides(k); opts.push({ ref: 'k:' + k, label: `${S.ko[k].start} ${S.ko[k].label}: ${t.a ? tname(t.a) : '?'} vs ${t.b ? tname(t.b) : '?'}`, mine: isMe(t.a) || isMe(t.b) }); });
  return opts;
}
function defaultTimerRef() { const n = myFixtures().find((f) => !f.done); return n ? n.ref : ('g:' + (S.matches[0] ? S.matches[0].id : '')); }
function viewTimer() {
  const ph = tPhases(); const P = PRESETS[T.preset] || PRESETS.group; const done = T.idx >= ph.length;

  if (!getMatch(T.ref)) { T.ref = defaultTimerRef(); saveT(); }
  const rem = tRem();
  return `${seg('preset', Object.entries(PRESETS).map(([k, v]) => [k, v.name]), T.preset, 't-preset', 'grid')}
  <section class="card timer ${cur[2]}" id="timer-card">
    <div class="phases">${ph.map((p, i) => `<span class="ph ${i < T.idx ? 'done' : i === T.idx ? 'cur' : ''}">${esc(p[0])} ${fmtMS(p[1])}</span>`).join('')}</div>
    <div class="t-label" id="t-label">${esc(cur[0])}</div>

    <div class="t-ctrl2"><button class="btn sm" data-action="t-reset">↺ เริ่มใหม่ทั้งแมตช์</button><button class="btn sm" data-action="t-next">⏭ ข้ามไปช่วงถัดไป</button><button class="btn sm" data-action="t-sound" aria-pressed="${!!T.sound}">${T.sound ? '🔔 เสียงเตือน: เปิด' : '🔕 เสียงเตือน: ปิด'}</button></div>
    ${T.preset === 'rest' ? `<label class="inline">กำหนดเวลา (นาที) <input type="number" min="1" max="180" inputmode="numeric" data-change="t-custom" value="${esc(T.custom)}"></label>` : ''}
    <p class="muted small" style="margin-top:10px">${esc(P.note)} • เตือนที่ 30 วิ, 10 วิ และ 3 วิสุดท้าย • เวลาทางการยึดตามกรรมการเสมอ</p>

function summaryText() {
  const e = S.event; const L = [];
  L.push(`🏆 ${myName()} | ${e.title}`);
  L.push(`${e.name} • ${e.category}`);
  L.push(`📅 ${fmtDateTh(e.date)} (เวลา${e.venueTzLabel})`);
  const pl = myPlacement(); if (pl) L.push(`ผลงาน: ${pl}`);
  const my = myGroup();
  groups().slice().sort((a, b) => (a === my ? -1 : b === my ? 1 : a.localeCompare(b))).forEach((g) => {
    const st = standings(g);
    L.push(''); L.push(`⚽ รอบกลุ่ม ${g} (แข่งแล้ว ${st.played}/${st.total})`);
    gMatches(g).slice().sort(byStart).forEach((m) => L.push(`${m.start}  ${tname(m.a)} ${hasScore(m) ? m.ga + '–' + m.gb : 'vs'} ${tname(m.b)}`));
    if (st.played) {
      L.push(`📊 ตารางคะแนนกลุ่ม ${g}`);
      st.ranked.forEach((r) => L.push(`${r.posMax > r.pos ? r.pos + '=' : r.pos}. ${tname(r.code)} — ${r.pts} แต้ม (แข่ง ${r.p} ต่าง ${sign(r.gd)})`));
    }
  });
  const koLines = KO_KEYS.map((k) => {
    const t = koSides(k), m = S.ko[k];
    if (!t.a && !t.b) return null;
    let s = `${m.label}: ${t.a ? tname(t.a) : '?'} ${hasScore(m) ? m.ga + '–' + m.gb : 'vs'} ${t.b ? tname(t.b) : '?'}`;
    if (hasScore(m) && m.ga === m.gb && koWin(k)) s += ` (ต่อเวลา: ${tname(koWin(k))} ชนะ)`;
    return s;
  }).filter(Boolean);
  if (koLines.length) { L.push(''); L.push('🏁 รอบน็อกเอาต์'); koLines.forEach((x) => L.push(x)); }
  if (koWin('final')) L.push(`🏆 แชมป์: ${tname(koWin('final'))}`);
  L.push(''); L.push(`🟨 ใบเหลือง ${shortMe()}: ${myYellow()}/4`);
  return L.join('\n');
}
async function copyText(t) {

  document.body.appendChild(ta); ta.select(); let ok = false;

function download(name, text, type) {
  const blob = text instanceof Blob ? text : new Blob([text], { type: type || 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; } }
function beep(freq, dur, vol) {
  if (!T.sound || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime;
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.18, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) { /* ignore */ }
}
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

const ACTIONS = {
  ui(el) { S.ui[el.dataset.key] = el.dataset.val; save(); rerender(); },
  go(el) {
    if (el.dataset.key) S.ui[el.dataset.key] = el.dataset.val;
    if (el.dataset.tref) { T.ref = el.dataset.tref; if (!T.running) { const p = presetFor(T.ref); if (p !== T.preset || T.idx >= tPhases().length) tSetPreset(p); } saveT(); }
    save(); closeModal(); navigate(el.dataset.tab || 'home');
  },
  settings() { openSettings(); },
  'modal-close'() { closeModal(); },
  undo() {
    if (!undoSnap) return;
    S = merge(DEFAULTS(), JSON.parse(undoSnap)); undoSnap = null; save(); applyTheme(); rerender();
    $('#toast').classList.remove('show'); toast('เลิกทำแล้ว');
  },
  score(el) {
    const m = getMatch(el.dataset.ref); if (!m) return;
    const s = el.dataset.side, o = s === 'a' ? 'b' : 'a', d = +el.dataset.d;
    m['g' + s] = Math.max(0, Math.min(99, (num(m['g' + s]) ? m['g' + s] : 0) + d));
    if (!num(m['g' + o])) m['g' + o] = 0;
    save(); rerender();
  },
  'score-clear'(el) {
    const m = getMatch(el.dataset.ref); if (!m) return;
    snapshot(); m.ga = null; m.gb = null; m.ya = 0; m.yb = 0; if ('et' in m) { m.et = ''; m.etRounds = 1; }
    save(); rerender(); toast('ล้างผลนัดนี้แล้ว', true);
  },
  yellow(el) {
    const m = getMatch(el.dataset.ref); if (!m) return;
    const k = 'y' + el.dataset.side; m[k] = Math.max(0, Math.min(9, (m[k] || 0) + (+el.dataset.d)));

const SD_DEFAULT = { key: '', uid: '', idToken: '', refreshToken: '', exp: 0, canEdit: false, name: '', flat: null, synced: false, disabled: false };

/* ---- เข้าสู่ระบบแบบไม่ระบุตัวตน (Anonymous) ---- */
async function authPost(url, body, form) {

    const r = await authPost(`${CFG.tokenURL}/v1/token?key=${encodeURIComponent(CFG.apiKey)}`, `grant_type=refresh_token&refresh_token=${encodeURIComponent(SD.refreshToken)}`, true);
    if (r.ok && r.j && r.j.id_token) {

      saveSync(); return SD.idToken;
    }
    if (r.status < 400 || r.status >= 500) throw new Error('token ' + r.status);
    SD.refreshToken = '';
  }
  const r = await authPost(`${CFG.authURL}/v1/accounts:signUp?key=${encodeURIComponent(CFG.apiKey)}`, JSON.stringify({ returnSecureToken: true }));
  if (!r.ok || !r.j || !r.j.idToken) throw new Error((r.j && r.j.error && r.j.error.message) || ('auth ' + r.status));

  SD.uid = r.j.localId; SD.idToken = r.j.idToken; SD.refreshToken = r.j.refreshToken; SD.exp = now + (+r.j.expiresIn || 3600) * 1000;

/* ---- รับข้อมูลสด ---- */
let connectSeq = 0;

  let tok;
  try { tok = await ensureToken(); } catch (e) {
    if (seq !== connectSeq) return;
    const msg = String((e && e.message) || e);
    if (/OPERATION_NOT_ALLOWED|ADMIN_ONLY/i.test(msg)) { SY.err = 'ยังไม่ได้เปิด Anonymous sign-in ใน Firebase Authentication'; setStatus('error'); return; }
    if (/API_KEY|API key/i.test(msg)) { SY.err = 'apiKey ใน config.js ไม่ถูกต้อง'; setStatus('error'); return; }
    SY.err = ''; setStatus('offline'); scheduleReconnect(); return;
  }
  if (seq !== connectSeq) return;
  let es;
  try { es = new EventSource(dbUrl('rooms/' + CFG.room, { auth: tok })); } catch (e) { SY.err = 'databaseURL ใน config.js ไม่ถูกต้อง'; setStatus('error'); return; }
  SY.es = es;
  es.addEventListener('put', (ev) => onStream(ev, false));
  es.addEventListener('patch', (ev) => onStream(ev, true));
  es.addEventListener('cancel', () => { es.close(); if (SY.es === es) SY.es = null; SY.err = 'ไม่มีสิทธิ์อ่านข้อมูล — ตรวจ Rules ใน Firebase'; setStatus('error'); });
  es.addEventListener('auth_revoked', () => { es.close(); SD.exp = 0; saveSync(); connect(); });
  es.onerror = () => {
    if (SY.es !== es) return;

}

}

}

/* ---- ส่งการแก้ไข (เฉพาะรายการที่เปลี่ยน) ---- */
function schedulePush(ms) {
  if (!online() || !SD.canEdit) return;
  clearTimeout(SY.pushTimer);

  renderNet();
}
async function pushNow() {
  clearTimeout(SY.pushTimer);
  if (!online() || !SD.canEdit || !SD.synced) return;
  if (SY.pushing) { schedulePush(300); return; }
  const upd = diffFlat(toFlat(S), SD.flat || {});
  const keys = Object.keys(upd);
  if (!keys.length) { renderNet(); return; }
  SY.pushing = true; renderNet();
  let retry = false;
  try {
    const tok = await ensureToken();
    const body = {};
    keys.forEach((k) => { body['data/' + k] = upd[k]; });
    body['meta/updatedAt'] = { '.sv': 'timestamp' };
    body['meta/by'] = SD.name || 'โค้ช';
    const r = await fetch(dbUrl('rooms/' + CFG.room, { auth: tok }), { method: 'PATCH', body: JSON.stringify(body) });
    if (r.status === 401 || r.status === 403) {
      SD.canEdit = false; saveSync();
      S = clone(fromFlat(SD.flat || {}, S.ui)); memo.clear(); saveLocal();
      toast('รหัสโค้ชถูกเปลี่ยนหรือหมดสิทธิ์ — ใส่รหัสโค้ชใหม่เพื่อแก้ไข');

  else if (SD.canEdit && Object.keys(diffFlat(toFlat(S), SD.flat || {})).length) schedulePush(200);
  renderNet();
}

/* ---- สิทธิ์โค้ช ---- */
async function unlock(pin) {
  pin = String(pin || '').trim();
  if (!pin) return;
  try {
    const tok = await ensureToken();
    const put = (body) => fetch(dbUrl('editors/' + SD.uid, { auth: tok }), { method: 'PUT', body });
    let r = await put(JSON.stringify(pin));
    if (!r.ok && /^\d+$/.test(pin) && pin.length < 16) r = await put(pin); // เผื่อกรอกรหัสเป็นตัวเลขล้วนใน Firebase
    if (r.ok) {
      SD.canEdit = true; saveSync(); closeModal(); MEDIA.err = ''; kickUpload(500);
      toast('ปลดล็อกโหมดโค้ชแล้ว — การแก้ไขจะขึ้นทุกเครื่องทันที');
      if (SY.status === 'live' && SD.synced && !Object.keys(SD.flat || {}).length) pushNow();
      rerender();
    } else if (r.status === 401 || r.status === 403) toast('รหัสโค้ชไม่ถูกต้อง');
    else toast('ปลดล็อกไม่สำเร็จ (' + r.status + ')');
  } catch (e) { toast('ไม่มีสัญญาณอินเทอร์เน็ต — ลองใหม่อีกครั้ง'); }
}

 * - โหมดออนไลน์: โค้ชแชร์ให้ทุกเครื่อง (ภาพย่อ ≤1600px, วิดีโอไม่เกินขนาดที่กำหนด)

/* ภาพถูกย่อแล้วจึงแชร์ได้เสมอ (เผื่อไฟล์แปลก ๆ ไม่เกิน 25 MB) • วิดีโอจำกัดตาม maxCloud */
const canCloud = (it) => it.size <= (it.kind === 'photo' ? 25 * 1024 * 1024 : maxCloud());
const THUMBS = new Map();

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('no indexedDB')); return; }
    const r = indexedDB.open('cwk-apra-media', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(new Error('blocked'));
  });
}
function idbDo(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const tx = MEDIA.db.transaction(store, mode); const req = fn(tx.objectStore(store));
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error || new Error('abort'));
  });
}
const idbGetBlob = (id) => idbDo('blobs', 'readonly', (st) => st.get(id));
const idbPutMeta = (it) => idbDo('meta', 'readwrite', (st) => st.put({ ...it }));
const idbPutBlob = (id, blob) => idbDo('blobs', 'readwrite', (st) => st.put(blob, id));
const idbDelete = (id) => Promise.all([idbDo('meta', 'readwrite', (st) => st.delete(id)), idbDo('blobs', 'readwrite', (st) => st.delete(id))]);

async function initMedia() {
  try {
    MEDIA.db = await idbOpen();
    const all = await idbDo('meta', 'readonly', (st) => st.getAll());
    (all || []).forEach((it) => { if (it && it.id) MEDIA.items.set(it.id, it); });
    MEDIA.ready = true;
  } catch (e) { MEDIA.failed = true; }
  if (S.ui.tab === 'plan' || S.ui.tab === 'home') refreshView();
  kickUpload(1000);
}

const fmtClip = (sec) => { sec = Math.max(0, Math.round(sec || 0)); return Math.floor(sec / 60) + ':' + pad(sec % 60); };

function fmtStampFull(ms) { const v = venueParts(ms); return `${v.d}/${v.mo}/${v.y} ${pad(v.h)}:${pad(v.mi)} น. (${S.event.venueTzLabel})`; }
function mediaFileName(it) { const v = venueParts(it.createdAt); return `${it.team}_${v.y}${pad(v.mo)}${pad(v.d)}-${pad(v.h)}${pad(v.mi)}${pad(v.s)}_${it.id.slice(-4)}.${it.ext || (it.kind === 'video' ? 'mp4' : 'jpg')}`; }

function teamMedia(code) { return [...MEDIA.items.values()].filter((it) => it.team === code && mediaVisible(it)).sort((a, b) => a.createdAt - b.createdAt); }
function dataUrlToBlob(d) {
  const i = d.indexOf(','); const head = d.slice(0, i); const bin = atob(d.slice(i + 1));
  const u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
  return new Blob([u], { type: (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg' });
}
function thumbURL(it) {

  if (!u || u.src !== it.thumb) { if (u) URL.revokeObjectURL(u.url); try { u = { src: it.thumb, url: URL.createObjectURL(dataUrlToBlob(it.thumb)) }; } catch (e) { return ''; } THUMBS.set(it.id, u); }

  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);

}
const canvasBlob = (c, type, q) => new Promise((res) => c.toBlob(res, type, q));

  return 'jpg';
}

/* ---- ภาพ: ย่อเหลือด้านยาว 1600px (พอสำหรับดูรายละเอียดหุ่น) + ภาพย่อ 240px ---- */
async function processPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const w = img.naturalWidth, h = img.naturalHeight;
    let blob = await canvasBlob(drawScaled(img, w, h, 1600), 'image/jpeg', 0.82);
    let mime = 'image/jpeg', ext = 'jpg';
    if (!blob || (/jpe?g/.test(file.type) && Math.max(w, h) <= 1600 && file.size <= blob.size)) { blob = new Blob([file], { type: file.type || 'image/jpeg' }); mime = blob.type; ext = extOf(file.name, mime); }
    const thumb = drawScaled(img, w, h, 240).toDataURL('image/jpeg', 0.62);
    const k = Math.min(1, 1600 / Math.max(w, h));
    return { blob, mime, ext, w: Math.round(w * k), h: Math.round(h * k), thumb, dur: 0 };
  } catch (e) {
    return { blob: new Blob([file], { type: file.type || 'application/octet-stream' }), mime: file.type || 'application/octet-stream', ext: extOf(file.name, file.type), w: 0, h: 0, thumb: '', dur: 0 };
  } finally { URL.revokeObjectURL(url); }
}
/* ---- วิดีโอ: เก็บไฟล์จริง + ภาพปกจากเฟรมที่ 25% ---- */
function processVideo(file) {
  return new Promise((resolve) => {
    const mime = file.type || 'video/mp4';
    const base = { blob: new Blob([file], { type: mime }), mime, ext: extOf(file.name, mime) };
    const url = URL.createObjectURL(file); const v = document.createElement('video');
    let done = false;
    const finish = (extra) => { if (done) return; done = true; clearTimeout(to); URL.revokeObjectURL(url); v.removeAttribute('src'); try { v.load(); } catch (e) { /* ignore */ } resolve({ ...base, w: 0, h: 0, dur: 0, thumb: '', ...extra }); };
    const to = setTimeout(() => finish({ w: v.videoWidth || 0, h: v.videoHeight || 0, dur: isFinite(v.duration) ? v.duration : 0 }), 8000);
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.onloadeddata = () => { const d = isFinite(v.duration) && v.duration > 0 ? v.duration : 0; try { v.currentTime = d ? Math.min(d * 0.25, 3) : 0.1; } catch (e) { finish({}); } };
    v.onseeked = () => {
      const dur = isFinite(v.duration) ? v.duration : 0;
      try { finish({ w: v.videoWidth, h: v.videoHeight, dur, thumb: v.videoWidth ? drawScaled(v, v.videoWidth, v.videoHeight, 240).toDataURL('image/jpeg', 0.62) : '' }); }
      catch (e) { finish({ w: v.videoWidth, h: v.videoHeight, dur }); }
    };
    v.onerror = () => finish({});
    v.src = url;
  });
}
function requestPersist() {
  if (MEDIA.persistAsked) return; MEDIA.persistAsked = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
}
async function addMedia(team, files) {
  if (!files.length || !team) return;
  if (!MEDIA.ready) { toast(MEDIA.failed ? 'เบราว์เซอร์นี้เก็บภาพ/วิดีโอในเครื่องไม่ได้ (เช่น โหมดส่วนตัว)' : 'กำลังเตรียมคลังภาพ ลองอีกครั้ง'); return; }
  let n = 0, big = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const isVideo = /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name || '');
    const isImage = /^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name || '');
    if (!isVideo && !isImage) continue;
    toast(`กำลังบันทึก ${i + 1}/${files.length}…`);
    const pr = isVideo ? await processVideo(f) : await processPhoto(f);
    const it = {
      id: 'md' + Date.now().toString(36) + uid(), team, kind: isVideo ? 'video' : 'photo', mime: pr.mime, ext: pr.ext,
      size: pr.blob.size, w: pr.w || 0, h: pr.h || 0, dur: isFinite(pr.dur) ? Math.round(pr.dur * 10) / 10 : 0,
      caption: '', createdAt: Date.now(), by: SD.name || '', thumb: pr.thumb || '', room: '', cloud: 'local', uploaded: 0, chunks: 0, hasBlob: true,
    };
    if (online() && SD.canEdit) { it.room = CFG.room; it.cloud = canCloud(it) ? 'queued' : 'toolarge'; if (it.cloud === 'toolarge') big++; }
    try { await idbPutBlob(it.id, pr.blob); await idbPutMeta(it); } catch (e) { toast('พื้นที่ในเครื่องไม่พอ หรือบันทึกไม่ได้'); break; }
    MEDIA.items.set(it.id, it); n++;

  requestPersist();
  rerender();
  toast(n ? `บันทึกแล้ว ${n} ไฟล์${big ? ` • วิดีโอ ${big} ไฟล์ใหญ่เกิน ${fmtMB(maxCloud())} จะเก็บเฉพาะเครื่องนี้` : ''}` : 'ไม่พบไฟล์ภาพหรือวิดีโอ');
  kickUpload(300);
}
async function getBlob(it) {
  const b = await idbGetBlob(it.id).catch(() => null);
  if (b) return b;
  if (!online() || !it.room || it.cloud !== 'synced') throw new Error('unavailable');
  const tok = await ensureToken();
  const r = await fetch(dbUrl(`media/${it.room}/blobs/${it.id}`, { auth: tok }));
  if (!r.ok) throw new Error('http ' + r.status);
  const obj = await r.json();
  if (!obj) throw new Error('missing');
  const n = it.chunks || Object.keys(obj).length; const parts = [];
  for (let i = 0; i < n; i++) {
    const c = obj[i] !== undefined ? obj[i] : obj[String(i)];
    if (typeof c !== 'string') throw new Error('missing chunk');
    parts.push(await (await fetch('data:application/octet-stream;base64,' + c)).blob());
  }
  const blob = new Blob(parts, { type: it.mime || 'application/octet-stream' });
  try { await idbPutBlob(it.id, blob); it.hasBlob = true; await idbPutMeta(it); } catch (e) { /* cache full: still show */ }

}

}

/* ---- ส่งขึ้นออนไลน์ (โค้ชเท่านั้น) ---- */
let upRunning = false, upTimer = null;
function kickUpload(ms) { clearTimeout(upTimer); upTimer = setTimeout(runUpload, ms || 50); }
async function mediaReq(path, method, body) {
  const tok = await ensureToken();
  const r = await fetch(dbUrl(path, { auth: tok }), { method, body: JSON.stringify(body) });
  if (r.status === 401 || r.status === 403) { const e = new Error('denied'); e.denied = true; throw e; }
  if (!r.ok) throw new Error('http ' + r.status);
}
function indexEntry(it) {
  return { team: it.team, kind: it.kind, mime: it.mime, ext: it.ext, size: it.size, w: it.w, h: it.h, dur: it.dur || 0, caption: it.caption || '', createdAt: it.createdAt, by: it.by || '', thumb: it.thumb || '', chunks: it.chunks };
}
async function uploadOne(it) {
  const blob = await idbGetBlob(it.id).catch(() => null);
  if (!blob) { it.cloud = 'local'; await idbPutMeta(it); return; }
  const chunks = Math.max(1, Math.ceil(blob.size / CHUNK)); it.chunks = chunks;
  for (let n = it.uploaded || 0; n < chunks; n++) {
    if (!MEDIA.items.has(it.id)) return;
    await mediaReq(`media/${it.room}/blobs/${it.id}/${n}`, 'PUT', await blobToB64(blob.slice(n * CHUNK, (n + 1) * CHUNK)));
    it.uploaded = n + 1; await idbPutMeta(it);
    $$(`[data-mprog="${it.id}"]`).forEach((el) => { el.textContent = `⬆ ${Math.round((it.uploaded / chunks) * 100)}%`; });
  }
  if (!MEDIA.items.has(it.id)) return;
  await mediaReq(`media/${it.room}/index/${it.id}`, 'PUT', indexEntry(it));
  it.cloud = 'synced'; delete it.dirty; await idbPutMeta(it);
}
async function runUpload() {
  if (upRunning || !MEDIA.ready || !online() || !SD.canEdit || SY.status !== 'live' || MEDIA.err) return;
  upRunning = true; let changed = false;
  try {
    for (const it of MEDIA.items.values()) {
      if (!it.room && it.hasBlob && it.cloud === 'local') { it.room = CFG.room; it.cloud = canCloud(it) ? 'queued' : 'toolarge'; await idbPutMeta(it); changed = true; }
    }
    for (;;) {
      const it = [...MEDIA.items.values()].filter((x) => x.room === CFG.room && (x.cloud === 'queued' || x.dirty)).sort((a, b) => a.createdAt - b.createdAt)[0];
      if (!it) break;
      if (it.cloud === 'queued') await uploadOne(it);
      else { await mediaReq(`media/${it.room}/index/${it.id}`, 'PATCH', { caption: it.caption || '' }); delete it.dirty; await idbPutMeta(it); }
      changed = true;
    }
  } catch (e) {
    if (e && e.denied) MEDIA.err = 'แชร์ภาพขึ้นออนไลน์ไม่ได้ — ตรวจว่าวาง Rules ล่าสุดใน Firebase แล้ว (ONLINE.md ข้อ 4) และยังอยู่ในโหมดโค้ช';
    else kickUpload(15000);
    changed = true;
  }
  upRunning = false;
  if (changed) softMedia();
}

/* ---- รับรายการภาพจากออนไลน์ (เปิดเมื่อเข้าหน้า "คู่แข่ง") ---- */
async function connectMedia() {
  if (!online() || MEDIA.es) return;
  let tok;
  try { tok = await ensureToken(); } catch (e) { setTimeout(connectMedia, 10000); return; }
  if (MEDIA.es || !online()) return;
  const es = new EventSource(dbUrl(`media/${CFG.room}/index`, { auth: tok }));
  MEDIA.es = es;
  const on = (ev, isPatch) => {
    let msg = null; try { msg = JSON.parse(ev.data); } catch (e) { msg = null; }
    if (!msg) return;
    let tree = MEDIA.remote || {};
    if (isPatch) Object.entries(msg.data || {}).forEach(([k, v]) => { tree = setPath(tree, String(msg.path || '').replace(/\/+$/, '') + '/' + k, v); });
    else tree = setPath(tree, msg.path, msg.data);
    MEDIA.remote = tree;
    MEDIA.chain = MEDIA.chain.then(reconcileMedia).catch(() => {});
  };
  es.addEventListener('put', (ev) => on(ev, false));
  es.addEventListener('patch', (ev) => on(ev, true));
  es.addEventListener('cancel', () => { es.close(); MEDIA.es = null; MEDIA.err = 'อ่านคลังภาพออนไลน์ไม่ได้ — ตรวจว่าวาง Rules ล่าสุดใน Firebase แล้ว (ONLINE.md ข้อ 4)'; softMedia(); });
  es.addEventListener('auth_revoked', () => { es.close(); MEDIA.es = null; SD.exp = 0; saveSync(); connectMedia(); });
  es.onerror = () => { if (MEDIA.es === es && es.readyState === 2) { MEDIA.es = null; setTimeout(connectMedia, 10000); } };
}
async function reconcileMedia() {
  if (!MEDIA.ready || !CFG) return;
  const remote = MEDIA.remote || {}; const room = CFG.room; let changed = false;
  for (const [id, m] of Object.entries(remote)) {
    if (!m || typeof m !== 'object' || !m.team || !m.kind) continue;
    const f = { team: m.team, kind: m.kind, mime: m.mime || '', ext: m.ext || '', size: +m.size || 0, w: +m.w || 0, h: +m.h || 0, dur: +m.dur || 0, caption: m.caption || '', createdAt: +m.createdAt || 0, by: m.by || '', thumb: m.thumb || '', chunks: +m.chunks || 1 };
    const cur = MEDIA.items.get(id);
    if (!cur) { const it = { id, ...f, room, cloud: 'synced', uploaded: f.chunks, hasBlob: false }; MEDIA.items.set(id, it); await idbPutMeta(it).catch(() => {}); changed = true; continue; }
    const next = { ...cur, ...f, room, cloud: 'synced' };
    if (cur.dirty) next.caption = cur.caption;
    if (canon(next) !== canon(cur)) { MEDIA.items.set(id, next); await idbPutMeta(next).catch(() => {}); changed = true; }
  }
  for (const it of [...MEDIA.items.values()]) {
    if (it.room === room && it.cloud === 'synced' && !remote[it.id]) { await removeLocal(it.id); changed = true; }
  }
  if (changed) softMedia();
}

/* ---- ดาวน์โหลดทั้งหมดเป็น .zip (ไม่บีบอัดซ้ำ เพราะภาพ/วิดีโอบีบอัดอยู่แล้ว) ---- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function dosTime(ms) { const d = new Date(ms); return { time: (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2), date: (Math.max(0, d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate() }; }
async function makeZip(files) {
  const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()); const crc = crc32(data); const nb = enc.encode(f.name); const t = dosTime(f.date || Date.now());
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, t.time, true); lh.setUint16(12, t.date, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, nb, f.blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, t.time, true); ch.setUint16(14, t.date, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, nb.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, nb);
    offset += 30 + nb.length + data.length;
  }
  const cdSize = central.reduce((a, x) => a + x.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}
function scoutText(code, items) {
  const t = team(code) || {}; const L = [];
  L.push(`ทีม: ${t.name || code} (${code})${t.from ? ' • ' + t.from : ''}`);
  L.push(`รายการ: ${S.event.name} • ${S.event.category}`);
  const vs = S.matches.find((m) => (m.a === code && isMe(m.b)) || (m.b === code && isMe(m.a)));
  if (vs && hasScore(vs)) L.push(`ผลที่เจอ ${myName()}: ${tname(vs.a)} ${vs.ga}–${vs.gb} ${tname(vs.b)}`);
  L.push('', 'บันทึกสเกาท์:', t.notes || '-', '', 'รายการไฟล์:');
  items.filter((x) => x.team === code).forEach((x) => L.push(`- ${mediaFileName(x)} • ${fmtStampFull(x.createdAt)}${x.by ? ' • ' + x.by : ''}${x.caption ? ' • ' + x.caption : ''}`));
  return '﻿' + L.join('\r\n');
}
let zipBusy = false;
async function exportZip(code) {
  if (zipBusy) return;
  const items = [...MEDIA.items.values()].filter(mediaVisible).filter((x) => !code || x.team === code).sort((a, b) => a.createdAt - b.createdAt);
  if (!items.length) { toast('ยังไม่มีภาพ/วิดีโอ'); return; }
  zipBusy = true;
  try {
    const files = []; let missing = 0;
    for (let i = 0; i < items.length; i++) {
      toast(`กำลังเตรียมไฟล์ ${i + 1}/${items.length}…`);
      try { files.push({ name: `${folderName(items[i].team)}/${mediaFileName(items[i])}`, blob: await getBlob(items[i]), date: items[i].createdAt }); }
      catch (e) { missing++; }
    }
    const teamsIn = [...new Set(items.map((x) => x.team))];
    teamsIn.forEach((c) => files.push({ name: `${folderName(c)}/บันทึกสเกาท์.txt`, blob: new Blob([scoutText(c, items)], { type: 'text/plain' }), date: Date.now() }));
    const zip = await makeZip(files);
    download(`cwk-scouting-${code ? safeName(code) : 'all'}-${stamp()}.zip`, zip);
    toast(missing ? `ดาวน์โหลดแล้ว (ข้าม ${missing} ไฟล์ที่ยังโหลดจากออนไลน์ไม่ได้)` : `ดาวน์โหลด .zip แล้ว (${items.length} ไฟล์ + บันทึกสเกาท์)`);
  } catch (e) { toast('สร้างไฟล์ .zip ไม่สำเร็จ (พื้นที่หน่วยความจำไม่พอ?) — ลองดาวน์โหลดทีละทีม'); }
  zipBusy = false;
}

/* ------------------------------------------------------------------
 * Clock tick
 * ------------------------------------------------------------------ */
let lastSec = -1, lastAutoRender = 0, lastBeepSec = null, renderedIdx = null;
function phaseEnd() {
  const ph = tPhases(); const ended = ph[T.idx] ? ph[T.idx][0] : '';
  T.running = false; T.remaining = 0; keepAwake(false);
  beep(520, 0.9, 0.22); try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) { /* ignore */ }
  if (T.idx < ph.length - 1) { T.idx++; T.remaining = ph[T.idx][1]; toast(`หมดเวลา “${ended}” → ถัดไป: ${ph[T.idx][0]} (กด ▶ เมื่อกรรมการสั่ง)`); }
  else { T.idx = ph.length; toast('หมดเวลาการแข่งขัน — ตรวจสกอร์ก่อนเซ็นใบคะแนน'); }
  saveT();
  if (S.ui.tab === 'timer') rerender();
}
function tick(force) {
  const now = Date.now();
  const rem = tRem();
  if (T.running) {
    const s = Math.ceil(rem);
    if (s !== lastBeepSec) { lastBeepSec = s; if (s === 30 || s === 10) beep(660, 0.18); else if (s >= 1 && s <= 3) beep(880, 0.12); }
    if (rem <= 0) { phaseEnd(); return; }
  }
  const ph = tPhases(); const done = T.idx >= ph.length; const cur = done ? null : ph[T.idx];
  const big = $('#t-big');
  if (big) {
    if (renderedIdx !== T.idx && S.ui.tab === 'timer') { rerender(); return; }
    big.textContent = fmtMS(done ? 0 : rem);
    const bar = $('#t-bar'); if (bar) bar.style.width = (cur ? Math.max(0, Math.min(100, (1 - rem / cur[1]) * 100)) : 100) + '%';
    const card = $('#timer-card'); if (card) card.classList.toggle('low', T.running && rem <= 10);
  }
  const pill = $('#tpill');
  const showPill = T.running && S.ui.tab !== 'timer' && cur;
  pill.hidden = !showPill;
  if (showPill) pill.textContent = `⏱ ${cur[0]} ${fmtMS(rem)}`;

  const sec = Math.floor(now / 1000);
  if (sec === lastSec && !force) return;
  lastSec = sec;
  $('#clk-v').textContent = clockStr(S.event.venueTz);
  $('#clk-h').textContent = clockStr(S.event.homeTz);
  let expired = false;
  $$('[data-until]').forEach((el) => { const left = (+el.dataset.until - now) / 1000; if (left <= 0 && left > -3) expired = true; el.textContent = fmtDur(left); });
  $$('[data-from]').forEach((el) => { const f = +el.dataset.from, t = +el.dataset.to; el.style.width = Math.max(0, Math.min(100, ((now - f) / (t - f)) * 100)) + '%'; });
  $$('[data-clock]').forEach((el) => { el.textContent = clockStr(S.event.venueTz); });
  const idle = !modalOpen() && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if (!force && idle && SY.dirty) { SY.dirty = false; rerender(); return; }
  if (!force && idle && (S.ui.tab === 'home' || S.ui.tab === 'schedule') && (expired || now - lastAutoRender > 30000)) rerender();
}

/* ------------------------------------------------------------------
 * Boot
 * ------------------------------------------------------------------ */
load();
loadSync();
applyTheme();
if (!VIEWS[(location.hash || '').slice(1)]) history.replaceState(null, '', '#' + (VIEWS[S.ui.tab] ? S.ui.tab : 'home'));
route();
setInterval(tick, 250);
if (T.running) keepAwake(true);
if (location.protocol.startsWith('http')) {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
if (online()) connect();
initMedia();
window.CWK = { media: () => [...MEDIA.items.values()].map((x) => ({ ...x, thumb: x.thumb ? 'yes' : '' })), mediaErr: () => MEDIA.err, state: () => S, standings, scenario, summaryText, sync: () => ({ status: SY.status, canEdit: SD.canEdit, pending: pendingCount(), uid: SD.uid, synced: SD.synced, err: SY.err, room: CFG && CFG.room }) };
})();
</script>
